# The ARC memory layer: clio-core CTE storage, liveness/retry policy and the
# in-process cache.

# CLIO_ARC_CACHE_CAPACITY  (int)  <- src/clio_agent/arc/memory.py
# Max entries in ARC's in-process LRU cache; raise to cut store re-reads on
# a low-RAM host, lower to shrink resident memory.
arc.cache_capacity: 1000

# CLIO_ARC_CLIO_CORE_DAEMON_RECYCLE  (bool)  <- src/clio_agent/arc/clio_core_daemon.py
# Opt-in: auto-stops the shared clio-core daemon when RSS-critical with zero
# live clients; enable on long-lived hosts to reclaim leaked memory.
arc.clio_core.daemon_recycle_enabled: false

# CLIO_ARC_CLIO_CORE_DAEMON_RSS_CRITICAL  (int)  <- src/clio_agent/arc/clio_core_daemon.py
# RSS bytes marking the shared clio-core daemon critical (recycle-eligible
# if idle); raise on a box with more RAM headroom.
arc.clio_core.daemon_rss_critical_bytes: 4294967296

# CLIO_ARC_CLIO_CORE_DAEMON_RSS_WARN  (int)  <- src/clio_agent/arc/clio_core_daemon.py
# RSS bytes marking the shared clio-core daemon elevated in the doctor
# report; tune to match normal daemon growth on this host.
arc.clio_core.daemon_rss_warn_bytes: 1073741824

# CLIO_ARC_CLIO_CORE_LIVENESS_TTL_S  (float)  <- src/clio_agent/arc/clio_core_liveness.py
# Seconds a clio-core liveness probe is trusted before re-checking the
# socket; raise to cut overhead, lower to catch a dead daemon faster.
arc.clio_core.liveness_ttl_s: 3.0

# CLIO_ARC_CLIO_CORE_WRITE_RETRY_ATTEMPTS  (int)  <- src/clio_agent/arc/clio_core_retry.py
# Max attempts (incl. the first) for a clio-core blob PutBlob before the
# write is recorded lost; raise if refusals under load need more headroom.
arc.clio_core_write_retry.attempts: 3

# CLIO_ARC_CLIO_CORE_WRITE_RETRY_BACKOFF_FACTOR  (float)  <- src/clio_agent/arc/clio_core_retry.py
# Multiplier applied to the write-retry delay after each failed attempt;
# raise to back off more aggressively, lower for tighter spacing.
arc.clio_core_write_retry.backoff_factor: 3.0

# CLIO_ARC_CLIO_CORE_WRITE_RETRY_FIRST_DELAY_S  (float)  <- src/clio_agent/arc/clio_core_retry.py
# Seconds before the first retry of a refused clio-core blob write; raise to
# give a transient pressure/restart condition more time to clear.
arc.clio_core_write_retry.first_delay_s: 0.2

# CLIO_CORE_PORT  (str)  <- src/clio_agent/arc/clio_core_liveness.py
# Overrides the clio-core RPC port the liveness prober and client dial; set
