gact.message_intents.max_queued_per_session: 100

# CLIO_GACT_MAX_SETTLED_STEERS_PER_SESSION  (int)  <- src/clio_agent/gact/message_intents.py
# Per-session cap on retained SETTLED (consumed/cancelled) pending-steer
