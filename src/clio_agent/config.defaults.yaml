gact.ledger_retention.turn_attempts.hard: 4000

# CLIO_LEDGER_TURN_ATTEMPTS_MAX  (int)  <- src/clio_agent/gact/runtime/retention.py
# Soft cap on the turn-attempts ledger where terminal entries evict first,
# protecting still-pending turn attempts.
gact.ledger_retention.turn_attempts.max: 2000

# CLIO_LIVE_EDGE_STREAMING  (bool)  <- src/clio_agent/gact/live_edge.py
