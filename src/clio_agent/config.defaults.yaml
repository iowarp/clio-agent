# operator attention" (e.g. SSH/2FA); tune for slow networks.
relay.install_surface.attention_idle_seconds: 45.0

# CLIO_RELAY_INSTALL_BOUNDED_TIMEOUT_S  (float)  <- src/clio_agent/tools/relay_cli_runner.py
# Timeout in seconds for a fast, non-SSH-dialing clio-relay CLI sub-probe
# (register/doctor/status); raise if calls time out on a slow host.
relay.install_surface.bounded_timeout_seconds: 60.0

# CLIO_RELAY_CLI_PATH  (str)  <- src/clio_agent/tools/relay_cli_runner.py
# Explicit path to the deployed clio-relay executable, overriding PATH
# discovery; set when it's installed somewhere non-standard.
# relay.install_surface.cli_path:  # default unset; resolved in code

# CLIO_RELAY_INSTALL_JOB_RETENTION_HARD_CAP  (int)  <- src/clio_agent/tools/relay_cli_runner.py
# Hard ceiling on tracked relay CLI jobs before even a running one is force-
# evicted; raise on a box driving many concurrent relay ops.
relay.install_surface.job_retention_hard_cap: 400

# CLIO_RELAY_INSTALL_JOB_RETENTION_MAX  (int)  <- src/clio_agent/tools/relay_cli_runner.py
# Soft cap on tracked relay CLI jobs; past this the oldest terminal job is
# evicted first to bound memory.
relay.install_surface.job_retention_max: 200

# CLIO_RELAY_INSTALL_LONG_OP_TIMEOUT_S  (float)  <- src/clio_agent/tools/relay_cli_runner.py
# Runaway timeout (seconds) for SSH-dialing relay CLI ops (bootstrap,
# session start/attach/teardown); raise for slow SSH targets.
relay.install_surface.long_operation_timeout_seconds: 900.0

# CLIO_RELAY_INSTALL_OUTPUT_TAIL_BYTES  (int)  <- src/clio_agent/tools/relay_cli_runner.py
# Byte cap on the retained stdout/stderr tail from a relay CLI subprocess
# call; raise for more diagnostic context on failures.
relay.install_surface.output_tail_bytes: 4096

# CLIO_RELAY_INSTALL_PARSED_DOCUMENT_MAX_BYTES  (int)  <- src/clio_agent/tools/relay_cli_runner.py
# Byte buffer size for parsing a whole clio-relay CLI JSON document; raise
# if a large session document is failing to parse.
relay.install_surface.parsed_document_max_bytes: 262144

# CLIO_RELAY_JARVIS_DOOR_NAMESPACE  (str)  <- src/clio_agent/tools/relay_factory.py
# The relay-registered JARVIS tool-name namespace prefix; set to "" to use
# relay's older compact-name door instead.
relay.jarvis_door_namespace: "remote_jarvis"

# CLIO_RELAY_MCP_URL  (str)  <- src/clio_agent/tools/relay_factory.py
# Relay MCP control endpoint URL; set together with relay.http_url to enable
# relay tool discovery.
# relay.mcp_url:  # default unset; resolved in code

# CLIO_RELAY_SESSION_GENERATION_ID  (str)  <- src/clio_agent/tools/relay_factory.py
# Generation id paired with relay.owner_session_id identifying this
# deployment's owned relay session; set both together or neither.
# relay.owner_session_generation_id:  # default unset; resolved in code

# CLIO_RELAY_OWNER_SESSION_ID  (str)  <- src/clio_agent/tools/relay_factory.py
# This deployment's owned relay HTTP-API session id, required with
# owner_session_generation_id when the relay door is session-bound.
# relay.owner_session_id:  # default unset; resolved in code

# CLIO_RELAY_REMOTE_AGENT_MCP_CONFIG_PATH  (str)  <- src/clio_agent/gact/relay_wiring.py
# Path to the MCP config file used by a remote relay-placed agent
# invocation; set to give spawned agents a specific tool config.
# relay.remote_agent.mcp_config_path:  # default unset; resolved in code

# CLIO_RELAY_REMOTE_AGENT_MODEL  (str)  <- src/clio_agent/gact/relay_wiring.py
# Model identifier used for agents spawned onto a relay cluster; override to
# run remote relay agents on a non-default model.
# relay.remote_agent.model:  # default unset; resolved in code

# CLIO_RELAY_REMOTE_AGENT_PROMPT_PATH  (str)  <- src/clio_agent/gact/relay_wiring.py
# Path to the prompt file for a relay-cluster-placed remote agent; required
# (with the cluster) for relay agent spawning to work.
# relay.remote_agent.prompt_path:  # default unset; resolved in code

# CLIO_RELAY_REMOTE_AGENT_WORKDIR  (str)  <- src/clio_agent/gact/relay_wiring.py
# Working directory used for a relay-placed remote agent invocation; set to
# point remote execution at a specific cluster directory.
# relay.remote_agent.workdir:  # default unset; resolved in code

# CLIO_RELAY_TOOL_SURFACES_TTL_SECONDS  (int)  <- src/clio_agent/gact/relay_wiring.py
# Seconds a discovered relay tool catalog is trusted before re-discovery;
# lower for faster pickup of new tools, raise to cut overhead.
relay.tool_surfaces_ttl_seconds: 300

# ==========================================================================
# Provenance, trace and debug
# ==========================================================================
# Agentic provenance export (Flowcept/JSONL), the semantic trace backend and
# debug/diagnostic knobs.

# CLIO_DUMP_UNPARSEABLE  (str)  <- src/clio_agent/lm/adapters.py
# Filesystem path to dump raw LM completions the adapter failed to parse;
# set when diagnosing a model/adapter mismatch, else a no-op.
# debug.dump_unparseable:  # default unset; resolved in code

# CLIO_DEBUG  (str)  <- src/clio_agent/runtime/trace.py
# Log verbosity ("off"/"low"/"med"/"high", default "low"); raise to "high"
# for per-call firehose logs, drop to "off" for quiet.
debug.level: "low"

# CLIO_LOG_LM_RESPONSE  (bool)  <- src/clio_agent/runtime/trace.py
# Legacy toggle that force-enables the lm_response trace tag; turn on to log
# every raw LM response without raising debug.level.
debug.lm_response: false

# CLIO_DEBUG_MEMPROF  (bool)  <- src/clio_agent/gact/diagnostics.py
# Switches the SIGUSR1 signal from a thread-traceback dump to a tracemalloc
# heap snapshot; enable when hunting a memory leak.
debug.memprof: false

# CLIO_DEBUG_MEMPROF_FRAMES  (int)  <- src/clio_agent/gact/diagnostics.py
# Stack depth (frames) tracemalloc records per allocation when debug.memprof
# is on; raise for finer leak attribution, at more overhead.
debug.memprof_frames: 20

# CLIO_DEBUG_MEMPROF_OUT  (str)  <- src/clio_agent/gact/diagnostics.py
# File stem for numbered memprof snapshot dumps; unset (default) writes each
# SIGUSR1 dump to stderr instead.
# debug.memprof_out:  # default unset; resolved in code

# CLIO_DEBUG_ONLY  (list)  <- src/clio_agent/runtime/trace.py
# Comma-separated tag whitelist overriding debug.level, emitting only listed
# trace tags; use for surgical logging of one code path.
# debug.only:  # computed at runtime: _no_only

# CLIO_SSE_EVENT_LOG  (str)  <- src/clio_agent/gact/routes/misc.py
# Filesystem path to append one JSON line per SSE event sent to any session;
# set to audit/replay the exact event sequence served.
# debug.sse_event_log:  # default unset; resolved in code

# CLIO_SSE_WIRE_TAP  (str)  <- src/clio_agent/gact/routes/misc.py
# Filesystem path to append the raw bytes written to an SSE connection; set
# for a byte-for-byte capture of what a client received.
# debug.sse_wire_tap:  # default unset; resolved in code

# CLIO_STREAM_AUDIT_LOG  (str)  <- src/clio_agent/runtime/stream_audit.py
# Filesystem path for JSONL stream-audit records (SSE scheduling, transcript
# events, receive times); set to diagnose streaming issues.
# debug.stream_audit_log:  # default unset; resolved in code

# CLIO_FLOWCEPT_CAMPAIGN_ID  (str)  <- src/clio_agent/gact/provenance/factory.py
# Free-text campaign label attached to every Flowcept provenance record; set
# to group runs under one campaign.
# provenance.agentic.flowcept.campaign_id:  # default unset; resolved in code

# CLIO_FLOWCEPT_CAMPAIGN_SCOPE  (str)  <- src/clio_agent/gact/provenance/factory.py
# Whether a Flowcept campaign spans one session or the whole process
# ("session" default); switch for many sessions as one campaign.
provenance.agentic.flowcept.campaign_scope: "session"

# CLIO_FLOWCEPT_CHECK_SAFE_STOPS  (bool)  <- src/clio_agent/gact/provenance/factory.py
# Whether Flowcept validates safe-stop points before treating a workflow as
# complete; disable only where the check misfires.
provenance.agentic.flowcept.check_safe_stops: true

# CLIO_FLOWCEPT_EXCLUDE_EVENTS  (list)  <- src/clio_agent/gact/provenance/factory.py
# Glob patterns of event types Flowcept drops (default excludes noisy per-
# token deltas and thinking events); widen to cut export volume.
provenance.agentic.flowcept.exclude_events: ["lm.token.delta", "thinking.*"]

# CLIO_FLOWCEPT_INCLUDE_EVENTS  (list)  <- src/clio_agent/gact/provenance/factory.py
# Glob patterns of event types Flowcept exports (default "*" = everything
# not excluded); narrow to scope provenance to specific events.
provenance.agentic.flowcept.include_events: ["*"]

# CLIO_FLOWCEPT_PRIVACY  (str)  <- src/clio_agent/gact/provenance/factory.py
# Flowcept payload privacy level ("metadata" default, no raw content); relax
# only when the Flowcept backend is trusted with full content.
provenance.agentic.flowcept.privacy: "metadata"

# CLIO_FLOWCEPT_WORKFLOW_SCOPE  (str)  <- src/clio_agent/gact/provenance/factory.py
# Whether a Flowcept workflow record spans one session or the process
# ("session" default); change to correlate sessions as one workflow.
provenance.agentic.flowcept.workflow_scope: "session"

# CLIO_PROVENANCE_JSONL_PATH  (str)  <- src/clio_agent/gact/provenance/factory.py
# Filesystem path for the JSONL provenance log; falls back to trace.path
# then the workspace default -- redirects provenance output.
# provenance.agentic.jsonl.path:  # default unset; resolved in code

# CLIO_PROVENANCE_PROVIDERS  (list)  <- src/clio_agent/provenance_config.py
# Comma-separated agentic provenance providers to run (default ["jsonl"]);
# add "flowcept" for external tooling, or clear to disable.
provenance.agentic.providers: ["jsonl"]

# CLIO_PROVENANCE_QUERY_DEFAULT  (str)  <- src/clio_agent/gact/routes/provenance.py
# Which provenance provider name /v1/provenance queries answer from by
# default ("native"); change to make Flowcept the default source.
provenance.agentic.query_default: "native"

# CLIO_PROVENANCE_QUEUE_SIZE  (int)  <- src/clio_agent/gact/provenance/factory.py
# Max buffered events in the provenance dispatcher's async queue before
# backpressure; raise on high event-rate sessions.
provenance.agentic.queue_size: 4096

# CLIO_CMF_ARTIFACT_ROOT  (str)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# Filesystem path where the CMF artifact-provenance backend stores artifact
# data (default under the app data dir); relocates the store.
# provenance.artifacts.cmf.artifact_root:  # default unset; resolved in code

# CLIO_CMF_ARTIFACT_STORE  (str)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# CMF backend's storage mode for artifact bytes (default 'reference': tracks
# by path, no duplication); rarely changed.
provenance.artifacts.cmf.artifact_store: "reference"

# CLIO_CMF_METADATA_PATH  (str)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# Filesystem path to the CMF metadata SQLite database (default under the app
# data dir); set to relocate or share the store.
# provenance.artifacts.cmf.metadata_path:  # default unset; resolved in code

# CLIO_CMF_PIPELINE_NAME  (str)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# Pipeline name CMF records against tracked artifacts (default 'clio-
# agent'); change to separate deployments sharing one CMF store.
provenance.artifacts.cmf.pipeline_name: "clio-agent"

# CLIO_CMF_PUBLISH_TIMEOUT_S  (float)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# Seconds the CMF backend waits for a publish call to a CMF server to
# complete; raise if publishing to a remote server times out.
provenance.artifacts.cmf.publish_timeout_s: 30.0

# CLIO_CMF_PYTHON  (str)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# Path of a LOCAL interpreter that can import cmflib, for the optional
# local-worker write mode; unsupported on Windows. Prefer server_url, which
# needs no local CMF.
# provenance.artifacts.cmf.python:  # default unset; resolved in code

# CLIO_CMF_SERVER_URL  (str)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# URL of the CMF metadata server to write artifact provenance to. Set this
# alone for the supported deployment: it needs no local CMF runtime on any
# client OS.
# provenance.artifacts.cmf.server_url:  # default unset; resolved in code

# CLIO_CMF_WORKER_URL  (str)  <- src/clio_agent/gact/artifacts/provenance/cmf_mode.py
# Reserved for a future in-stack CMF write service; setting it is refused
# today. Use server_url.
# provenance.artifacts.cmf.worker_url:  # default unset; resolved in code

# CLIO_ARTIFACT_PROVENANCE_EVENTS  (list)  <- src/clio_agent/gact/artifacts/provenance/factory.py
# Which artifact event types (created, version.added, proposed, ...) reach
# the selected provenance provider; narrow to cut writes.
# provenance.artifacts.include_events:  # computed at runtime: sorted(DEFAULT_ARTIFACT_EVENTS)

# CLIO_NATIVE_ARTIFACT_STORE  (str)  <- src/clio_agent/gact/artifacts/provenance/factory.py
# Storage backend for the built-in (non-CMF) artifact-provenance provider;
# only 'file' is supported today.
provenance.artifacts.native.storage: "file"

# CLIO_ARTIFACT_PROVENANCE_PROVIDER  (str)  <- src/clio_agent/gact/artifacts/provenance/factory.py
# Which backend records artifact lineage: 'native' (built-in) or 'cmf'
# (Common Metadata Framework); switch to integrate with CMF.
provenance.artifacts.provider: "native"

# CLIO_ARTIFACT_PROVENANCE_QUEUE_SIZE  (int)  <- src/clio_agent/gact/artifacts/provenance/factory.py
# Max queued artifact-provenance events awaiting async dispatch; raise if a
# slow provider causes drops under bursty activity.
provenance.artifacts.queue_size: 4096

# CLIO_SEMANTIC_TRACE_DETAIL  (str)  <- src/clio_agent/gact/_params.py
# Verbosity of recorded semantic-trace events; raise for deeper post-hoc
# analysis, lower to shrink trace volume/storage.
trace.detail_level: "semantic"

# CLIO_SEMANTIC_TRACE_PATH  (str)  <- src/clio_agent/gact/provenance/factory.py
# Legacy/shared filesystem path for the semantic trace backend, used as a
# fallback for provenance.agentic.jsonl.path when unset.
# trace.path:  # default unset; resolved in code

# CLIO_SEMANTIC_TRACE_CONFIG  (str)  <- src/clio_agent/gact/provenance/factory.py
# JSON config blob (as a string) passed to a custom semantic-trace factory
# backend; only relevant with trace.semantic_factory set.
# trace.semantic_config:  # default unset; resolved in code

# CLIO_SEMANTIC_TRACE_FACTORY  (str)  <- src/clio_agent/gact/provenance/factory.py
# Import path of a custom Python factory supplying the semantic-trace
# backend; set only to replace the built-in jsonl/flowcept providers.
# trace.semantic_factory:  # default unset; resolved in code

# ==========================================================================
# SPOTTER surveillance
# ==========================================================================
# The spotter-ai standing watcher and the clearance barrier a protected
# session's tool calls wait on.

# CLIO_SPOTTER_CLEARANCE_PROGRESS_TIMEOUT_S  (float)  <- src/clio_agent/gact/spotter_clearance.py
# No-progress window (seconds) between observable SPOTTER watcher signals
# before a protected tool call fails closed; active checks never trip it.
spotter.clearance_progress_timeout_s: 180.0

# CLIO_SPOTTER_MAX_CLEARANCE_EVENTS  (int)  <- src/clio_agent/gact/spotter_clearance.py
# Retention bound on the per-session SPOTTER clearance-event map; raise only
# for many concurrent protected sessions.
spotter.max_clearance_events: 256

# CLIO_SPOTTER_BLUEPRINT_ID  (str)  <- src/clio_agent/gact/spotter_watcher.py
# Agent-Blueprint id used to build the SPOTTER standing watcher child
# session; change to point spotter-ai at a custom watcher blueprint.
spotter.watcher_blueprint_id: "spotter-ai"

# CLIO_SPOTTER_EXPERT_ID  (str)  <- src/clio_agent/gact/spotter_watcher.py
# Expert id within the watcher blueprint SPOTTER arms as the standing
# watcher; change alongside watcher_blueprint_id for a custom expert.
spotter.watcher_expert_id: "spotter_watcher"
