# POST replay; raise for clients that retry over long windows, lower to
# shrink the intent store.
gact.message_intents.max_acceptances_per_session: 200

# CLIO_GACT_MAX_QUEUED_MESSAGES_PER_SESSION  (int)  <- src/clio_agent/gact/message_intents.py
# Per-session cap on durable queued (future) messages; a create past it is
