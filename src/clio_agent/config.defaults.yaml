gact.resident_ledgers.idle_ttl_s: 1800.0

# CLIO_RESIDENT_LEDGERS_MAX_BYTES  (int)  <- src/clio_agent/gact/resident_ledgers.py
# Byte cap on the total resident transcript-ledger cache across all
# sessions; raise on a host with more RAM to keep more sessions warm.
gact.resident_ledgers.max_bytes: 536870912

# CLIO_RESIDENT_LEDGERS_MAX  (int)  <- src/clio_agent/gact/resident_ledgers.py
# Max sessions whose transcript ledgers stay resident in memory at once;
# raise to keep more sessions warm at the cost of memory.
gact.resident_ledgers.max_sessions: 512

# CLIO_HOOKS_ALLOW_MANAGED_ONLY  (bool)  <- src/clio_agent/gact/hooks/dispatcher.py
