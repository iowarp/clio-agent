# arc.core_port:  # default unset; resolved in code

# CLIO_ARC_CTE_DIR  (str)  <- src/clio_agent/arc/clio_core_config.py
# Directory clio-core's CTE artifacts (config, file-tier data, logs) are
# written under; change to relocate ARC's disk storage.
# arc.cte.dir:  # default unset; resolved in code

# CLIO_ARC_CTE_DISK_WARN_FRACTION  (float)  <- src/clio_agent/arc/clio_core_config.py
# Fraction (0-1) of the CTE file-tier capacity that triggers a disk-space
# warning; lower for earlier warnings before the tier fills.
arc.cte.disk_warn_fraction: 0.5

# CLIO_ARC_CTE_FILE_CAPACITY  (str)  <- src/clio_agent/arc/clio_core_config.py
# Capacity string (e.g. "50GB") for clio-core's disk-backed file storage
# tier; raise if the working set needs more durable disk space.
arc.cte.file_capacity: "50GB"

# CLIO_ARC_CTE_RAM_CAPACITY  (str)  <- src/clio_agent/arc/clio_core_config.py
# Hard byte ceiling (e.g. "1GB") for clio-core's RAM working arena; raise
# for more headroom -- a deliberate desktop cap on DRAM growth.
arc.cte.ram_capacity: "1GB"

# CLIO_ARC_EVENTS_CHUNK_SEGMENTS  (int)  <- src/clio_agent/arc/memory.py
# Semantic-event segments held per on-disk chunk of a session's event log
# before rolling; raise to cut chunk count, lower to bound re-encode cost.
arc.events_chunk_segments: 512

# CLIO_ARC_LIVENESS_BACKOFF_INITIAL_S  (float)  <- src/clio_agent/arc/rpc_liveness.py
# Seconds of initial backoff before the first retry of a stalled (zombie)
# clio-core RPC; raise to give a slow daemon more recovery time.
arc.liveness.backoff_initial_s: 2.0

# CLIO_ARC_LIVENESS_BACKOFF_MAX_S  (float)  <- src/clio_agent/arc/rpc_liveness.py
# Seconds cap on the growing backoff delay between stalled-RPC retries;
# lower to fail faster overall, raise to tolerate longer hiccups.
arc.liveness.backoff_max_s: 15.0

# CLIO_ARC_LIVENESS_RETRIES  (int)  <- src/clio_agent/arc/rpc_liveness.py
# Retry attempts after a clio-core RPC stalls (no response) before the store
# is quarantined as runtime-lost; raise for a flakier daemon.
arc.liveness.retries: 3

# CLIO_ARC_LIVENESS_STALL_AFTER_S  (float)  <- src/clio_agent/arc/rpc_liveness.py
# Seconds one clio-core RPC may run with no response before it's treated as
# a stalled zombie peer; raise for very large blob ops.
arc.liveness.stall_after_s: 30.0

# CLIO_ARC_LSM_COMPACTION_THRESHOLD  (int)  <- src/clio_agent/arc/memory.py
# Memtable flushes accumulated before the ARC metrics LSM tree compacts into
# one file; raise to compact less often, lower for eager compaction.
arc.lsm_compaction_threshold: 5

# CLIO_ARC_LSM_MEMTABLE_SIZE  (int)  <- src/clio_agent/arc/memory.py
# Max entries in the ARC metrics LSM tree's in-memory memtable before it
# flushes to disk; raise to batch more writes, lower to bound memory.
arc.lsm_memtable_size: 1000

# CLIO_SERVER_CONF  (str)  <- src/clio_agent/arc/clio_core_liveness.py
# Path to a clio-core server YAML config the port-resolution logic reads;
# set to point liveness probing at a non-default config file.
# arc.server_conf:  # default unset; resolved in code

# CLIO_ARC_STORE  (str)  <- src/clio_agent/arc/storage.py
# Selects the ARC persistence backend: "cte" (clio-core, default) or "local"
# (plain files); use "local" for guaranteed on-disk durability.
arc.store: "cte"

# CLIO_ARC_STORE_CONFIG  (str)  <- src/clio_agent/arc/storage.py
# Path to the clio-core CTE config used when arc.store is "cte"; set to
