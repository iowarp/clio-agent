artifacts.export_license: "NOASSERTION"

# CLIO_ARTIFACTS_HASH_MAX_FILE_BYTES  (int)  <- src/clio_agent/gact/artifacts/minting.py
# Byte ceiling on hashing a designated output at mint time; larger files are
