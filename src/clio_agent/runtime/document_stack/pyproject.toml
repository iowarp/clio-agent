requires-python = ">=3.12"
dependencies = [
    "filelock>=3.19,<4",
    "truststore==0.10.4",
    "pymupdf>=1.26,<2",
    "pypdf>=5.1,<7",
    "pdfplumber>=0.11,<1",
    "reportlab>=4.4,<5",
    "python-docx>=1.1.2,<2",
    "python-pptx>=1.0.2,<2",
    "openpyxl>=3.1.5,<4",
    "odfpy>=1.4.1,<2",
    "pillow>=10,<13",
    "lxml>=5,<7",
    "defusedxml>=0.7,<1",
    "nodejs-wheel-binaries==24.19.0",
    "psutil>=5.9,<8",
]

[tool.uv]
package = false
