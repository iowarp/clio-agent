# CLIO — no-install Docker deployment using the published ghcr.io images
# (no local build needed; pulls our released images).
#
#   docker compose up clio-web         # web UI  → http://localhost:8080
#   docker compose --profile api up    # headless backend (API/SSE) → :8100  (scale-out)
#
# The interactive TUI is not a service (a containerised TUI needs a real tty);
# run it directly instead:
#   docker run -it --rm \
#     -e CLIO_LM_API_BASE=http://host.docker.internal:1234/v1 \
#     ghcr.io/iowarp/clio-tui:latest
#
# Point CLIO at your LM: override CLIO_LM_* (defaults assume LM Studio on the host).
services:
  # Path (b)/(c): self-contained web UI + bundled backend — the quick-start.
  clio-web:
    image: ghcr.io/iowarp/clio-web:latest
    ports:
      - "8080:80"
    environment:
      - CLIO_LM_PROVIDER=${CLIO_LM_PROVIDER:-lm_studio}
      - CLIO_LM_API_BASE=${CLIO_LM_API_BASE:-http://host.docker.internal:1234/v1}
      - CLIO_LM_MODEL=${CLIO_LM_MODEL:-}
      - CLIO_LM_API_KEY=${CLIO_LM_API_KEY:-lm-studio}
      - CLIO_ENVIRONMENT=production
    volumes:
      - clio-data:/home/clio/.config/clio-agent
    restart: unless-stopped

  # Path (d): headless backend only, for scale-out / programmatic clients.
  clio-api:
    image: ghcr.io/iowarp/clio-api:latest
    profiles: ["api"]
    ports:
      - "8100:8100"
    environment:
      - CLIO_LM_PROVIDER=${CLIO_LM_PROVIDER:-lm_studio}
      - CLIO_LM_API_BASE=${CLIO_LM_API_BASE:-http://host.docker.internal:1234/v1}
      - CLIO_LM_MODEL=${CLIO_LM_MODEL:-}
      - CLIO_LM_API_KEY=${CLIO_LM_API_KEY:-lm-studio}
      - CLIO_ENVIRONMENT=production
    volumes:
      - clio-data:/home/clio/.config/clio-agent
    restart: unless-stopped

volumes:
  clio-data:
