# Default daemon config for the cross-process test fixture (issues #659/#561).
# The fixture points CLIO_SERVER_CONF here so the daemon's storage config is
# DETERMINISTIC and checked in — not whatever happens to be in ~/.clio/clio.yaml.
#
# CORRECTED 2026-06-17 (clio-core#561): the previous config used `capacity: "0g"` /
# `capacity_limit: "0g"`, which mean "80% of total system DRAM" (kDefaultRamCapacityFraction
# in clio-core bdev_tasks.h). On a busy box that grabs nearly all RAM and the daemon falls
# over under sustained load — which we MISDIAGNOSED as a clio-core "wedge at ~32 concurrent."
# It was OUR config. With a BOUNDED dram allocator + a small RAM tier that spills to a FILE
# tier, a properly-configured daemon sustains 128 concurrent client processes with zero
# failures (RSS bounded ~430MB). So: bound the allocator, and give CTE a disk tier so blobs
# land on disk instead of filling memory.

networking:
  port: 9413
  neighborhood_size: 32
  wait_for_restart: 30
  wait_for_restart_poll_period: 1

runtime:
  num_threads: 4
  queue_depth: 4096
  local_sched: "default"
  first_busy_wait: 10000
  learning_rate: 0.2

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "2GB"              # BOUNDED shared-mem allocator (was "0g" = 80% of system RAM)

  - mod_name: clio_cae_core
    pool_name: cae_main
    pool_query: local
    pool_id: "400.0"
    next_pool_id: "512.0"

  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"

    storage:
      - path: "ram::cte_ram_tier1"
        bdev_type: "ram"
        capacity_limit: "512MB"      # small fast tier — fills, then spills to disk below
        score: 1.0
      - path: "/tmp/clio_cte_test/tier_file.bin"
        bdev_type: "file"
        capacity_limit: "8GB"        # DISK tier: blobs land here so RAM stays bounded
        score: 0.0

    dpe:
      dpe_type: "max_bw"

    targets:
      neighborhood: 1
      default_target_timeout_ms: 30000
      poll_period_ms: 5000

    performance:
      stat_targets_period_ms: 50
      max_concurrent_operations: 256
      score_threshold: 0.7
      score_difference_threshold: 0.05
      flush_metadata_period_ms: 5000
      flush_data_period_ms: 10000
      flush_data_min_persistence: 1
      transaction_log_capacity: "256MB"
