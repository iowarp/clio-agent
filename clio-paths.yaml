# DRAFT: Jaime must confirm every entry before this manifest is treated as the contract for clio-agent.
# Contract 1.1 adoption. Legacy CLIO_USER_DIR preserves its old config/data/cache layout.
# Explicit CLIO_PREFIX and remote managed roots may relocate the app and its role roots.
# Core host coordination uses native state/core-hosts even when CLIO_AGENT_HOME isolates content.
# Existing native-XDG user stores and Core supervision records remain active until explicit migration.
# Legacy workspace data is retained until explicit migration; credentials remain file-0600.
schema: clio.filesystem/v1
product: clio-agent
layout_version: 1
env_prefix: CLIO_AGENT_
roots:
  linux:
    config: ${XDG_CONFIG_HOME}/${PRODUCT}
    data: ${XDG_DATA_HOME}/${PRODUCT}
    state: ${XDG_STATE_HOME}/${PRODUCT}
    cache: ${XDG_CACHE_HOME}/${PRODUCT}
  macos:
    config: ${HOME}/Library/Application Support/${PRODUCT}/config
    data: ${HOME}/Library/Application Support/${PRODUCT}/data
    state: ${HOME}/Library/Application Support/${PRODUCT}/state
    cache: ${HOME}/Library/Caches/${PRODUCT}
  windows:
    config: ${APPDATA}/${PRODUCT}/config
    data: ${LOCALAPPDATA}/${PRODUCT}/data
    state: ${LOCALAPPDATA}/${PRODUCT}/state
    cache: ${LOCALAPPDATA}/${PRODUCT}/cache
project:
  root: .clio-agent
  registration: read-only
  shared:
  - path: shared
    kind: directory
  local:
  - path: local
    kind: directory
    self_ignore: true
