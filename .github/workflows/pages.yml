name: Pages

# Deploy the static landing site (site/) to GitHub Pages on push to main.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Product screenshots are committed directly under site/assets/ (hero.png,
      # desktop-shell.png, shots/1-5). They used to be staged at deploy time from
      # external/gact-tui/apps/web/screenshots/audit, but gact-tui #235 stopped
      # committing those run-output captures, which broke this deploy. Owning the
      # curated marketing set in this repo (where the site lives) decouples the
      # landing page from the submodule's volatile screenshot layout. Refresh the
      # set per docs/CLIO_INSTALL_PAGE_IMAGE_MANIFEST.md when the product UI changes.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
