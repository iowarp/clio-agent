name: Pages

# Deploy the static landing site (site/) to GitHub Pages on push to main.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pull the product screenshots straight from the gact-tui submodule at deploy
      # time (curated set per docs/CLIO_INSTALL_PAGE_IMAGE_MANIFEST.md) instead of
      # committing copies that go stale as the tui team regenerates them. The site
      # references stable site/assets/* paths; this step fills them from the submodule.
      - name: Stage product screenshots from gact-tui submodule
        run: |
          aud=external/gact-tui/apps/web/screenshots/audit
          mkdir -p site/assets/shots
          cp "$aud/ndp-earthscope-live-final.png"                         site/assets/hero.png
          cp "$aud/desktop-linux-xvfb-chat-clio-18190-attached-1440.png"  site/assets/desktop-shell.png
          cp "$aud/ndp-earthscope-live-artifact-preview.png"             site/assets/shots/1-artifact.png
          cp "$aud/overnight-real-markdown-preview.png"                   site/assets/shots/2-markdown.png
          cp "$aud/overnight-real-image-preview.png"                      site/assets/shots/3-image.png
          cp "$aud/overnight-real-file-editor-diff.png"                   site/assets/shots/4-diff.png
          cp "$aud/overnight-real-streaming-final.png"                    site/assets/shots/5-streaming.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
