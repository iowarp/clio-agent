name: Pages

# Build the public site (site/, Astro + Starlight) and deploy it to GitHub
# Pages at clio.iowarp.ai on push to main. Pull requests that touch the site
# run the same build and tests without deploying, so a broken page or link
# is caught before it reaches main.
#
# The site reads the release version from pyproject.toml at build time, so a
# version bump redeploys it. Product captures live in site/src/assets/captures;
# refresh them per docs/CLIO_INSTALL_PAGE_IMAGE_MANIFEST.md.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pyproject.toml"
      - "src/clio_agent/gact/builtin_skills/present-interactive-analysis/**"
      - "external/clio-agent-marketplace"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "src/clio_agent/gact/builtin_skills/present-interactive-analysis/**"
      - "external/clio-agent-marketplace"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Build the public gallery from the production widget renderer. Keep this
      # commit pinned so a docs deploy cannot silently change its UI behavior.
      - uses: actions/checkout@v4
        with:
          repository: iowarp/gact-tui
          ref: aa7a52f3ef2ef2a6488ca4e3f8ab7f4152b48a0e
          path: gact-tui-checkout
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile
        working-directory: gact-tui-checkout
      - run: pnpm --filter @clio/workspace exec vite build
        working-directory: gact-tui-checkout
        env:
          CLIO_GALLERY_STANDALONE: '1'
      - run: node scripts/stage-widgets.mjs ../gact-tui-checkout/web/dist
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      # Fails on any broken internal link (starlight-links-validator).
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
