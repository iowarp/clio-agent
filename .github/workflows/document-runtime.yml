name: Document runtime

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/clio_agent/runtime/document_stack/**"
      - "src/clio_agent/runtime/document_runtime.py"
      - "src/clio_agent/runtime/document_install.py"
      - "src/clio_agent/runtime/codex_windows_helpers.py"
      - "src/clio_agent/runtime/execution_environment.py"
      - "src/clio_agent/tools/servers/shell_server.py"
      - "scripts/qualification/document_runtime/**"
      - "src/clio_agent/prompt_packs/builtin/clio.chat.md"
      - "install/install.*"
      - "src/clio_agent/gact/document_tools.py"
      - "src/clio_agent/gact/documents/**"
      - "src/clio_agent/gact/artifacts/designation_tool.py"
      - "src/clio_agent/gact/artifacts/wire.py"
      - "src/clio_agent/gact/viewed_media.py"
      - "src/clio_agent/gact/builtin_skills/work-with-*/**"
      - ".github/workflows/document-runtime.yml"

jobs:
  document-smoke:
    runs-on: ${{ matrix.os }}
    env:
      # Reproduce default Desktop storage: MSI property values contain spaces.
      CLIO_AGENT_HOME: ${{ github.workspace }}/.tmp/CLIO Desktop document smoke
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Linux OS libraries required by the private renderer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libx11-6 libx11-xcb1 libxext6 libxinerama1 libsm6 libice6 libfontconfig1 libcups2 libdbus-1-3 libnss3 libglib2.0-0t64 fonts-liberation
      - name: Prepare the agent environment
        run: uv sync --frozen --python 3.13
      - name: Extract the Windows renderer into managed storage with spaces
        if: runner.os == 'Windows'
        run: uv run --frozen python -c "from clio_agent import paths; from clio_agent.runtime.document_stack.office import VERSION, ensure_office; print(ensure_office(paths.user_cache_dir() / 'document-office' / VERSION))"
      - name: Run installation-time package and renderer provisioning
        env:
          # Avoid shared-runner anonymous API limits when verifying official assets.
          CLIO_CODEX_RELEASE_TOKEN: ${{ github.token }}
        run: uv run --frozen python -m clio_agent.runtime.document_install --workspace document-evidence/workspace
      - name: Verify managed shells, workspace scratch and all four document formats
        run: uv run --frozen python scripts/qualification/document_runtime/verify_install.py document-evidence/workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-evidence-${{ matrix.os }}
          path: document-evidence
