name: Docker

on:
  push:
    branches: [main, develop]
    paths:
      - "docker/**"
      - "branding/**"
      - "external/gact-tui/**"
      - ".github/workflows/docker.yml"
    # Release images: the push-to-ghcr step is gated on a v* tag ref, but without
    # this trigger the workflow never RAN on tags - release images were silently
    # never pushed (found on v0.6.0; a submodule gitlink bump also does not match
    # the external/gact-tui/** path filter on branch pushes).
    tags: ["v*"]
  workflow_dispatch: {}
  pull_request:
    paths:
      - "docker/**"
      - "branding/**"
      - "external/gact-tui/**"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: iowarp

jobs:
  build:
    name: build · ${{ matrix.image }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clio-api
            dockerfile: docker/Dockerfile.clio-api
          - image: clio-web
            dockerfile: docker/Dockerfile.clio-web
          - image: clio-tui
            dockerfile: docker/Dockerfile.clio-tui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
