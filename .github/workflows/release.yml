name: Release

# Publish clio-agent to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) -- no API token secret needed.
# One-time setup on PyPI before the first release:
#   PyPI project "clio-agent" -> Settings -> Publishing -> add a
#   trusted publisher:
#     owner:        iowarp
#     repository:   clio-agent
#     workflow:     release.yml
#     environment:  pypi
# If the project doesn't exist on PyPI yet, create it (or do one manual
# `uv publish --token ...` for the first upload, then switch to OIDC).

on:
  push:
    tags:
      - "v*"

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $pkg" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke built wheel with registry-resolved dependencies
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/clio-agent-wheel-smoke"
          export UV_TOOL_DIR="$smoke_root/tools"
          export UV_TOOL_BIN_DIR="$smoke_root/bin"
          wheel="$(find dist -maxdepth 1 -type f -name 'clio_agent-*.whl' -print -quit)"
          test -n "$wheel"
          uv tool install --python 3.12 --no-cache "$wheel"
          version="${GITHUB_REF_NAME#v}"
          "$UV_TOOL_BIN_DIR/clio-agent" --version | grep -Fx "clio-agent $version" >/dev/null

      - name: Publish to PyPI
        run: uv publish

  registry-smoke:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Smoke the published persistent uv tool
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export UV_TOOL_DIR="$RUNNER_TEMP/clio-agent-registry-smoke/tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/clio-agent-registry-smoke/bin"
          for attempt in $(seq 1 12); do
            if uv tool install --python 3.12 --no-cache --with dspy==3.3.0b1 "clio-agent==$version"; then
              "$UV_TOOL_BIN_DIR/clio-agent" --version | grep -Fx "clio-agent $version" >/dev/null
              "$UV_TOOL_DIR/clio-agent/bin/python" -c \
                "import dspy; assert dspy.__version__ == '3.3.0b1'; assert hasattr(dspy, 'ReActV2')"
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "published clio-agent $version did not become installable from PyPI" >&2
              exit 1
            fi
            sleep 10
          done
