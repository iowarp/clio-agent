name: CI

on:
  push:
    branches: [main, develop, "v*"]
  pull_request:
    branches: [main, develop, "campaign/**", "codex/**"]
  # provider-sdk-bump.yml dispatches CI on its bump branch: a PR opened with
  # GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch: {}

jobs:
  # Every job carries timeout-minutes just above its measured normal duration, so a
  # hang fails the job in minutes instead of running to GitHub's 6-hour limit. The
  # per-test limit (pytest-timeout, tests/_hang_guard.py) fails a hung TEST first,
  # with every thread's stack in the log; the job limit is the outer backstop.
  lint:
    # Static checks, split from the test leg so they run in parallel with it
    # (measured ~2 min; they used to add that to the serial check job).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Tests marked `marketplace` read the pinned submodule and FAIL (never
      # skip) without it (tests/_marketplace.py); say so here, before the suite.
      - name: Assert the marketplace submodule is checked out
        run: ls external/clio-agent-marketplace/*/AGENT.md > /dev/null
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --python ${{ matrix.python-version }} --extra dev --extra optimizers
      - run: uv run ruff check src/ tests/ scripts/create_demo_data.py scripts/validate_marketplace_blueprints.py scripts/mcp_mem_attribution.py
      # Formatting is checked, never rewritten by CI: drift fails the job and the
      # author runs `uv run ruff format src/ tests/ scripts/` locally.
      - name: ruff format (check only)
        run: uv run ruff format --check --diff src/ tests/ scripts/
      # Anti-re-accretion guardrails (iowarp/clio-agent#714, #774). BLOCKING:
      # now that the #767 gact decomposition has landed, these enforce per-file
      # ratchet baselines -- a new god-file or a baselined file that regrows
      # past its recorded count fails the build. The baselines may only ratchet
      # DOWN (see the scripts' RATCHET_BASELINE docstrings).
      - name: "guard: file-size ratchet (#714, #774)"
        run: uv run python scripts/check_file_size.py
      - name: "guard: no class-in-function ratchet (#714, #774)"
        run: uv run python scripts/check_no_class_in_function.py
      - name: "guard: no delegation-summary vocabulary (baseline 0) (#880)"
        run: uv run python scripts/check_no_summaries.py
      - name: "guard: no settle/synthesis routing vocabulary (baseline 0) (#948)"
        run: uv run python scripts/check_no_settle_vocabulary.py
      - name: "guard: no elicitationId residue (baseline 0) (SEP-2577, C1-S4 #1284)"
        run: uv run python scripts/check_no_elicitation_id_vocabulary.py
      - name: "guard: no bare dspy.Tool outside the instrumentation factory/bridge (baseline 0)"
        run: uv run python scripts/check_tool_instrumentation.py
      # Model-capabilities brief Part 8 (P6). BLOCKING: fails if any
      # catalogs/models/*.yaml is invalid, if catalogs/model-overlay.json is
      # stale relative to the YAML sources, or
      # if catalogs/claude-code-models.json no longer validates against its schema.
      - name: "guard: model overlay + catalog schemas are valid and up to date (brief Part 8)"
        run: uv run python scripts/compile_model_overlay.py --check
      - name: "warn: ruff complexity (C901, PLR0915) (#714)"
        run: uv run ruff check --select C901,PLR0915 src/
        continue-on-error: true
      # Silent-fallback ratchet (iowarp/clio-agent#772). BLOCKING: reports
      # BLE001/S110/E722 counts and fails when the total EXCEEDS the baseline
      # recorded in the script (which may only ratchet down as sites are
      # burned down).
      - name: "check: silent-fallback ratchet (BLE001, S110, E722) (#772)"
        run: uv run python scripts/check_silent_fallbacks.py
      # The same rules with noqa IGNORED, per file (clio-core fail-stop): a file may not
      # gain a hidden broad except; the recorded baseline only ratchets down.
      - name: "check: noqa-hidden swallow ratchet, per file"
        run: uv run python scripts/check_noqa_swallows.py
      - run: bash -n scripts/homelab-env.sh
      - run: uv run mypy src/

  check:
    # The suite runs as 3 deterministic shards (tests/_sharding.py) per interpreter,
    # each on its own runner with one xdist worker per logical CPU. One 4-worker
    # runner took 23-29 min; the tests are CPU-bound (every gact test builds an app),
    # so more workers on the same 4 vCPUs only contend.
    name: check (${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Measured on this change's first green run: 6.8-9.5 min on 3.13, 11.6-12.0 min
    # on 3.12 (setup included).
    timeout-minutes: 18
    strategy:
      # fail-fast off: a 3.13 discovery must not cancel the 3.12 leg the
      # release gate reads (utah-cluster class: hosts we deploy to already
      # run 3.13, so both interpreters are release-relevant).
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --python ${{ matrix.python-version }} --extra dev --extra optimizers
      # Coverage flags are explicit here on purpose: pyproject addopts is empty so
      # local pytest runs stay lean (iowarp/clio-agent#773). Each shard records
      # branch coverage; the coverage job below combines the shards and checks the
      # floor. -n logical: one xdist worker per logical CPU (``-n auto`` counts
      # PHYSICAL cores and started only 2); each worker gets its own private
      # clio-core daemon (tests/_cte_isolation.py). worksteal rebalances the long
      # tail; --durations keeps the slowest tests visible in every log.
      - run: >-
          uv run pytest tests/ -m "not integration"
          --num-shards 3 --shard-id ${{ matrix.shard }}
          -n logical --dist worksteal --durations=30
          --cov=clio_agent --cov-branch --cov-report=
      # Uploaded even when a test failed, so the coverage job still reports the shard's
      # numbers (the failed shard keeps the build red on its own).
      - if: ${{ !cancelled() }}
        run: mv .coverage coverage-${{ matrix.shard }}.dat
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.dat
          retention-days: 3

  coverage:
    # Combines the shards' coverage per interpreter and enforces the floor.
    # Coverage floor lowered to 70 as the v0.5 merge brought in large under-tested
    # gact code; tracked in iowarp/clio-agent#31 to ratchet back up to 80% as the
    # new code gets tests. The floor is anchored one point below the measured
    # combined line+branch total (measured 79% on develop @ 2026-07-07; floor 78)
    # so a genuine regression fails CI while normal noise does not.
    name: coverage (${{ matrix.python-version }})
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5  # measured locally: combine + report take seconds
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --python ${{ matrix.python-version }} --extra dev
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-${{ matrix.python-version }}-*
          merge-multiple: true
      # All three shards must have reported: a missing shard is a failure, never a
      # smaller denominator.
      - run: test "$(ls coverage-*.dat | wc -l)" -eq 3
      - run: uv run coverage combine coverage-*.dat
      - run: uv run coverage report --show-missing --fail-under=78

  bundle-lock-resolve:
    # The bundled CLIO Desktop runtime installs clio-agent[BUNDLE_EXTRAS]
    # against a `uv export` of those extras, but clio-bundles.yml builds it on
    # tags only. Resolve that exact install set against the exported lock for
    # every bundled target here, so a conflict (the hardcoded clio-kit pin vs
    # the locked click) fails the PR instead of the release.
    runs-on: ubuntu-latest
    timeout-minutes: 5  # measured ~15 s
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv run --no-project --python 3.12 python scripts/check_bundle_matches_lock.py --resolve

  flowcept-integration:
    # The Flowcept live-runtime test is excluded from the main leg (integration
    # marker) and would silently rot as skip-only — this job installs the
    # flowcept extra and actually exercises it (#1247).
    runs-on: ubuntu-latest
    timeout-minutes: 5  # measured ~40 s
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --python 3.12 --extra dev --extra flowcept
      # Fail FAST if the extra did not yield an importable flowcept — otherwise
      # importorskip would skip the module and this job would go green having
      # tested nothing (the exact skip-rot it exists to prevent).
      - run: uv run python -c "import flowcept"
      - run: uv run pytest tests/test_gact/test_flowcept_integration.py -m integration -q

  flake-hunt:
    # Concurrency / shared-state tests (marked ``@pytest.mark.concurrency``) run
    # under xdist load repeated x3. This surfaces GENUINELY-THREADED races that a
    # single serial run masks: EventBus cross-thread publish (#758) and ARC
    # concurrent segment writes, whose failure is timing-dependent and only shows
    # up over repeated interleavings. NOTE: ``--dist loadfile`` isolates each file
    # to its OWN worker PROCESS, so it does NOT reproduce #735 (a single-process
    # multi-app module-global clobber) — that class is guarded DETERMINISTICALLY
    # by test_sync_mcp_tool_executor_prefers_per_turn_observer_over_clobbered_global
    # and the two-app telemetry test in the serial ``check`` job. Kept separate
    # from ``check`` so its parallel/repeat flags never touch the coverage-gated
    # main run.
    runs-on: ubuntu-latest
    timeout-minutes: 10  # measured ~2.5 min
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --extra dev --extra optimizers
      - run: uv run pytest -m concurrency -n 4 --dist loadfile --count 3 -p no:cacheprovider
