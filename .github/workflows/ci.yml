name: CI

on:
  push:
    branches: [main, develop, "v*"]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --extra dev --extra optimizers
      - run: uv run ruff check src/ tests/ scripts/create_demo_data.py scripts/validate_marketplace_blueprints.py
      # Anti-re-accretion guardrails (iowarp/clio-agent#714). WARN-ONLY for now:
      # continue-on-error so they report during the in-progress gact
      # decomposition without blocking the build. To be flipped to blocking in
      # the final phase of the refactor.
      - name: "warn: file-size guard (#714)"
        run: uv run python scripts/check_file_size.py
        continue-on-error: true
      - name: "warn: no class-in-function guard (#714)"
        run: uv run python scripts/check_no_class_in_function.py
        continue-on-error: true
      - name: "warn: ruff complexity (C901, PLR0915) (#714)"
        run: uv run ruff check --select C901,PLR0915 src/
        continue-on-error: true
      - run: bash -n scripts/homelab-env.sh
      - run: uv run mypy src/
      # Coverage floor lowered to 70 as the v0.5 merge brought in
      # large under-tested gact code; tracked in iowarp/clio-agent#31
      # to ratchet back up to 80% as the new code gets tests.
      - run: uv run pytest tests/ -m "not integration" --cov-fail-under=70
