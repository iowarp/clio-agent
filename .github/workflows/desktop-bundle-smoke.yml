name: Linux and Windows packaged startup

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'install/**'
      - 'branding/**'
      - 'uv.lock'
      - 'external/gact-tui'
      - 'scripts/smoke_desktop_package.py'
      - '.github/workflows/desktop-bundle-smoke.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  installed-startup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Build the real portable runtime (Linux)
        if: runner.os == 'Linux'
        run: bash install/build-gact-runtime.sh external/gact-tui/desktop/src-tauri/gact-runtime
        env:
          CLIO_AGENT_SOURCE: ${{ github.workspace }}
      - name: Build and pack the real portable runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install/build-gact-runtime.ps1 -Out external/gact-tui/desktop/src-tauri/gact-runtime -Source $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install/pack-gact-runtime.ps1
      - name: Prepare CLIO branding and unsigned qualification artifacts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');
          const root = process.env.GITHUB_WORKSPACE;
          const ui = path.join(root, 'external/gact-tui');
          const revision = (cwd) => execFileSync('git', ['rev-parse', 'HEAD'], {cwd, encoding: 'utf8'}).trim();
          const agentRevision = revision(root);
          const uiRevision = revision(ui);
          const projectVersion = fs.readFileSync(path.join(root, 'pyproject.toml'), 'utf8').match(/^version\s*=\s*"(\d+\.\d+\.\d+)/m)?.[1];
          if (!projectVersion) throw new Error('Missing agent version for development Desktop');
          const version = `${projectVersion}-dev.${agentRevision.slice(0, 8)}`;
          fs.writeFileSync(path.join(ui, 'brand.config.local.json'), JSON.stringify({profile: 'clio', brandingRoot: path.join(root, 'branding')}));
          fs.cpSync(path.join(root, 'branding/clio/icons'), path.join(ui, 'desktop/src-tauri/icons'), {recursive: true});
          fs.cpSync(path.join(root, 'branding/clio/installer'), path.join(ui, 'desktop/src-tauri/installer'), {recursive: true});
          const bundle = {createUpdaterArtifacts: false};
          if (process.platform === 'win32') {
            const windowsPack = JSON.parse(fs.readFileSync(path.join(ui, 'desktop/src-tauri/tauri.bundled.windows-pack.conf.json'), 'utf8'));
            Object.assign(bundle, windowsPack.bundle);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'smoke-config.json'), JSON.stringify({version, bundle}));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'desktop-source.json'), JSON.stringify({
            schema: 1, version, agent_revision: agentRevision, ui_revision: uiRevision,
            unsigned_development_build: true,
          }, null, 2));
          NODE
          bash external/gact-tui/desktop/scripts/fetch-sidecar.sh ${{ matrix.target }}
      - name: Build an installable Desktop package from the pinned UI
        working-directory: external/gact-tui
        shell: bash
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter @clio/desktop run gen-brand-backend
          pnpm --filter @clio/desktop tauri build --bundles ${{ matrix.bundles }} \
            --config "$GITHUB_WORKSPACE/external/gact-tui/desktop/src-tauri/tauri.bundled.conf.json" \
            --config "$RUNNER_TEMP/smoke-config.json"
      - name: Install DEB and launch native Desktop with its packaged backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(external/gact-tui/desktop/src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          sudo dpkg -i "${packages[0]}"
          xvfb-run -a uv run --no-project --python 3.14 --with psutil \
            scripts/smoke_desktop_package.py /usr/bin/clio-desktop --evidence-dir "$RUNNER_TEMP/startup-evidence" \
            --boot-log "$HOME/.local/share/ai.iowarp.clio.desktop/logs/backend-boot.log"
      - name: Install NSIS and launch native Desktop with its compressed runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem external/gact-tui/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if ($packages.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'clio-installed'
          # Wait for NSIS itself, not every background descendant it started.
          # Keep the wait bounded so a silent failure still reaches log upload.
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $installer = Start-Process -FilePath $packages[0].FullName -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -PassThru
          if (-not $installer.WaitForExit(600000)) {
            $installer.Kill($true)
            if (-not $installer.WaitForExit(10000)) { Write-Warning 'Installer cleanup did not finish within 10 seconds' }
            throw 'NSIS installer did not exit within 10 minutes; see the retained installer logs'
          }
          $timer.Stop()
          @{
            installer_seconds = [math]::Round($timer.Elapsed.TotalSeconds, 3)
            exit_code = $installer.ExitCode
            install_kind = 'fresh_ci_install'
          } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/installer-timing.json" -Encoding utf8
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          uv run --no-project --python 3.14 --with psutil scripts/smoke_desktop_package.py "$installDir/clio-desktop.exe" --evidence-dir "$env:RUNNER_TEMP/startup-evidence" --boot-log "$env:LOCALAPPDATA/ai.iowarp.clio.desktop/logs/backend-boot.log" --agent-home "$installDir/data/clio-agent"
      - name: Measure subsequent Windows startup with the same managed packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'clio-installed'
          uv run --no-project --python 3.14 --with psutil scripts/smoke_desktop_package.py "$installDir/clio-desktop.exe" --evidence-dir "$env:RUNNER_TEMP/startup-evidence-repeat" --boot-log "$env:LOCALAPPDATA/ai.iowarp.clio.desktop/logs/backend-boot.log" --agent-home "$installDir/data/clio-agent"
      - name: Collect Windows installer diagnostics even before first launch
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'startup-evidence'
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          $installerLogs = @{
            'installer-error.log' = Join-Path $env:RUNNER_TEMP 'clio-installed/data/runtime-install-error.log'
            'installer-boot.log' = Join-Path $env:LOCALAPPDATA 'ai.iowarp.clio.desktop/logs/backend-boot.log'
          }
          foreach ($entry in $installerLogs.GetEnumerator()) {
            if (Test-Path -LiteralPath $entry.Value -PathType Leaf) {
              Copy-Item -LiteralPath $entry.Value -Destination (Join-Path $evidenceDir $entry.Key)
            }
          }
      - name: Retain the qualified installable development Desktop
        uses: actions/upload-artifact@v4
        with:
          name: development-desktop-${{ matrix.os }}
          path: |
            external/gact-tui/desktop/src-tauri/target/release/bundle/${{ matrix.bundles }}/*
            ${{ runner.temp }}/desktop-source.json
            ${{ runner.temp }}/installer-timing.json
            ${{ runner.temp }}/startup-evidence-repeat/receipt.json
            ${{ runner.temp }}/startup-evidence/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain sanitized startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-startup-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/startup-evidence/receipt.json
            ${{ runner.temp }}/startup-evidence/desktop.log
            ${{ runner.temp }}/startup-evidence/backend.json
            ${{ runner.temp }}/startup-evidence/failure.json
            ${{ runner.temp }}/startup-evidence/boot.log
            ${{ runner.temp }}/startup-evidence/installer-error.log
            ${{ runner.temp }}/startup-evidence/installer-boot.log
            ${{ runner.temp }}/installer-timing.json
            ${{ runner.temp }}/startup-evidence-repeat/
          if-no-files-found: warn
          retention-days: 7
