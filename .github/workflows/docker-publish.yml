name: Docker Publish

# Build + push CLIO container images to GitHub Container Registry (ghcr.io) when a
# version tag is pushed -- so `docker pull ghcr.io/iowarp/clio-<api|web|tui>:<ver>`
# serves OUR released images instead of a build-your-own-from-source story.
#
# Images (one per distribution surface), all built from this tagged source tree +
# pinned submodules (gact-tui for web/tui), carrying CLIO OCI branding labels:
#   ghcr.io/iowarp/clio-api : the gact REST/SSE backend (clio-agent-gact)
#   ghcr.io/iowarp/clio-web : nginx + the CLIO web UI (gact-tui apps/web) + backend
#   ghcr.io/iowarp/clio-tui : the CLIO terminal UI (gact, GACT_BRAND=clio) + backend
#
# Auth uses the workflow GITHUB_TOKEN (packages: write) -- no extra secret needed.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.clio-api
          - name: web
            dockerfile: docker/Dockerfile.clio-web
          - name: tui
            dockerfile: docker/Dockerfile.clio-tui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clio-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=CLIO ${{ matrix.name }}
            org.opencontainers.image.vendor=iowarp

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
