# Weekly provider component bump: keep releases on the LATEST Codex runtime and Claude Code SDK.
#
# The providers gate new models by client version (the ChatGPT backend hides a
# model from Codex clients older than its minimal_client_version), so a release
# that ships a lagging openai-codex-cli-bin / claude-agent-sdk
# hides models the user's account already serves. scripts/bump_provider_sdks.py
# moves their pyproject floors + uv.lock to the newest final releases with a
# wheel for every bundle target; this workflow opens (or refreshes) the bump PR
# against develop.
#
# A PR opened with GITHUB_TOKEN does not trigger pull_request workflows, so CI
# is dispatched on the bump branch explicitly (workflow_dispatch is the one
# event GITHUB_TOKEN may trigger); its checks attach to the PR's head commit.
# Requires "Allow GitHub Actions to create and approve pull requests".
name: provider-sdk-bump
on:
  schedule:
    - cron: "23 6 * * 1"   # weekly, Monday 06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: chore/provider-sdk-bump
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: astral-sh/setup-uv@v5
      - name: Compute and apply the bump
        id: bump
        run: python scripts/bump_provider_sdks.py
      - name: Open or update the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.bump.outputs.title }}
          BODY: ${{ steps.bump.outputs.body }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base develop --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
      - name: Summary
        env:
          CHANGED: ${{ steps.bump.outputs.changed }}
          TITLE: ${{ steps.bump.outputs.title }}
        run: |
          {
            echo "## Provider SDK bump"
            if [ "$CHANGED" = "true" ]; then
              echo "$TITLE"
            else
              echo "Provider SDKs are current."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
