name: CLIO bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Frozen-at-tag escape hatch: an already-released tag (e.g. v0.9.4.1)
          to regenerate the Tauri update manifest / release-completeness
          check for, without re-running the desktop/web/tui/installers
          builds. Checked out explicitly rather than relying on whichever
          ref this workflow run was launched from.
        required: true
        type: string

env:
  PNPM_VERSION: "9.15.9"
  NODE_VERSION: "22.x"

jobs:
  installers:
    name: installer scripts
    # Full-build jobs run only for a real tag push; workflow_dispatch is the
    # frozen-at-tag escape hatch for release-check's manifest/completeness
    # work on an ALREADY-released tag, not a rebuild trigger.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            install/install.sh
            install/install.ps1
            install/clio
            install/clio.cmd
            install/clio.ps1
            install/uninstall.sh
            install/uninstall.ps1

  tui:
    name: tui · ${{ matrix.goos }}-${{ matrix.goarch }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build CLIO TUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          out="clio-tui-${GOOS}-${GOARCH}${{ matrix.ext }}"
          ./scripts/build_clio_tui.sh "$out"
          sha256sum "$out" > "$out.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            clio-tui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            clio-tui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256

  web:
    name: web bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: external/gact-tui/pnpm-lock.yaml
      - name: Install
        working-directory: external/gact-tui
        run: pnpm install --frozen-lockfile=false
      - name: Select CLIO brand (gact-tui config-file mechanism)
        shell: bash
        run: |
          root="${GITHUB_WORKSPACE//\\//}/branding"
          printf '{ "profile": "clio", "brandingRoot": "%s" }\n' "$root" \
            > external/gact-tui/brand.config.local.json
      - name: Build CLIO web
        working-directory: external/gact-tui
        run: pnpm --filter @clio/workspace build
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/clio-web-stage"
          mkdir -p "$stage"
          cp -r external/gact-tui/web/dist "$stage/clio-web-$version"
          (cd "$stage" && zip -r "clio-web-$version.zip" "clio-web-$version")
          sha256sum "$stage/clio-web-$version.zip" > "$stage/SHA256SUMS.web.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/clio-web-stage/clio-web-*.zip
            ${{ runner.temp }}/clio-web-stage/SHA256SUMS.web.txt

  desktop:
    name: desktop · ${{ matrix.variant }} · ${{ matrix.os }} / ${{ matrix.target }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, bundled]
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundle-args: "--bundles msi,nsis"
          # Windows on ARM: native build on GitHub's hosted windows-11-arm
          # runner (no x64 emulation). The bundled embedded Python runtime is
          # built on this arm64 runner, so it is the correct arch.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            # The hosted Windows ARM runner's Tauri bundler cannot fetch WiX or
            # NSIS over HTTPS because cargo-tauri reports no TLS backend there.
            # Build the native app and publish the raw executable instead.
            bundle-args: "--no-bundle"
          - target: aarch64-apple-darwin
            os: macos-14
            bundle-args: "--bundles app,dmg --target aarch64-apple-darwin"
          # Intel macOS: GitHub is retiring the x86 `macos-13` runners, so
          # cross-compile the x86_64 target ON an Apple-Silicon `macos-14` runner
          # (the rust toolchain step installs the x86_64-apple-darwin target).
          - target: x86_64-apple-darwin
            os: macos-14
            bundle-args: "--bundles app,dmg --target x86_64-apple-darwin"
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bundle-args: "--bundles deb,appimage,rpm"
          - target: x86_64-unknown-linux-gnu
            variant: bundled
            bundle-args: "--bundles deb,rpm"
          # Linux on ARM: native build on GitHub's hosted ubuntu-22.04-arm
          # runner. Fills the real gap — Linux has no built-in x64 emulation,
          # so an x86 .deb/.AppImage will not run on arm64 Linux.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            bundle-args: "--bundles deb,appimage,rpm"
          - target: aarch64-unknown-linux-gnu
            variant: bundled
            bundle-args: "--bundles deb,rpm"
        exclude:
          # The bundled variant embeds a host-built Python runtime, which installs
          # clio-agent + its core dep clio-core (iowarp-core). clio-core ships
          # platform wheels (no sdist), and upstream has NO wheel for Intel macOS
          # (x86_64-apple-darwin) nor Windows on ARM (aarch64-pc-windows-msvc), so
          # `uv pip install clio-agent` cannot resolve a runtime on those hosts and
          # the bundled build would fail. Ship both as the LITE variant only until
          # clio-core publishes wheels for them; the bundles can be regenerated then.
          # (Tracked in the packaging-parity issue.)
          - variant: bundled
            target: x86_64-apple-darwin
          - variant: bundled
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: external/gact-tui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: astral-sh/setup-uv@v5
        if: matrix.variant == 'bundled'
      - name: Linux deps
        if: runner.os == 'Linux'
        working-directory: external/gact-tui
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev pkg-config patchelf rpm
      - name: Install
        working-directory: external/gact-tui
        run: pnpm install --frozen-lockfile=false
      - name: Build sidecar launcher
        shell: bash
        run: bash external/gact-tui/desktop/scripts/fetch-sidecar.sh ${{ matrix.target }}
      # Portable embedded runtime (#909): built by OUR scripts (the brand
      # owns its runtime; gact-tui is generic infrastructure) from THIS
      # checkout, so the bundle ships exactly the released tree. The script
      # ships the interpreter inside the runtime (no venv) and proves
      # portability by booting a relocated copy before returning.
      - name: Build embedded clio-agent runtime
        if: matrix.variant == 'bundled' && runner.os != 'Windows'
        shell: bash
        run: bash install/build-gact-runtime.sh external/gact-tui/desktop/src-tauri/gact-runtime
        env:
          CLIO_AGENT_SOURCE: ${{ github.workspace }}
      - name: Build embedded clio-agent runtime (Windows)
        if: matrix.variant == 'bundled' && runner.os == 'Windows'
        shell: pwsh
        run: ./install/build-gact-runtime.ps1 -Out external/gact-tui/desktop/src-tauri/gact-runtime -Source $env:GITHUB_WORKSPACE
      - name: Pack embedded clio-agent runtime (Windows)
        if: matrix.variant == 'bundled' && runner.os == 'Windows'
        shell: pwsh
        run: ./install/pack-gact-runtime.ps1
      - name: Select CLIO brand (gact-tui config-file mechanism)
        shell: bash
        run: |
          root="${GITHUB_WORKSPACE//\\//}/branding"
          printf '{ "profile": "clio", "brandingRoot": "%s" }\n' "$root" \
            > external/gact-tui/brand.config.local.json
      - name: Build web
        working-directory: external/gact-tui
        run: pnpm --filter @clio/workspace build
      - name: Generate brand backend descriptor
        working-directory: external/gact-tui
        run: pnpm --filter @clio/desktop run gen-brand-backend
      - name: Assert CLIO brand compiled
        shell: bash
        run: |
          set -euo pipefail
          # The desktop bundle must compile the CLIO brand, not the neutral
          # connect-mode default that shipped before #841. Two independent
          # signals: the generated backend descriptor is managed-mode, and the
          # web dist carries a CLIO-distinctive marker string.
          gen="external/gact-tui/desktop/src-tauri/gen/brand-backend.json"
          jq -e '.mode == "managed" and .sidecarName == "clio-agent"' "$gen" >/dev/null \
            || { echo "::error::brand assert: $gen is not managed/clio-agent (neutral connect-mode build)"; exit 1; }
          dist="external/gact-tui/web/dist"
          if ! grep -rqI 'Gnosis Research Center' "$dist"; then
            echo "::error::brand assert: CLIO marker absent from $dist (neutral web build)"
            exit 1
          fi
      - name: Check CLIO icon set completeness
        shell: bash
        run: |
          set -euo pipefail
          # gact-tui's check-brand-icons.mjs (desktop `check-icons` script)
          # asserts a complete Tauri icon set (32/128/128@2x/icon.png >=512/
          # icon.ico with a 256px frame/icon.icns). Guarded: an older pinned
          # gact-tui commit may not carry the script yet, in which case this
          # is a no-op, never a build failure.
          checker="external/gact-tui/desktop/scripts/check-brand-icons.mjs"
          if [ ! -f "$checker" ]; then
            echo "check-brand-icons.mjs not present in this gact-tui pin yet -- skipping icon-set check"
          else
            node "$checker" "${{ github.workspace }}/branding/clio/icons"
          fi
      - name: Apply CLIO icons
        shell: bash
        run: |
          set -euo pipefail
          # Copy the CLIO icon family over the neutral gact-tui icons so the
          # overlay's relative "icons/..." paths resolve to branded art. A
          # copy-over is more robust than "../../../.." paths in the overlay.
          src="${{ github.workspace }}/branding/clio/icons"
          dst="external/gact-tui/desktop/src-tauri/icons"
          cp -f "$src"/* "$dst"/
      - name: Check CLIO installer art
        shell: bash
        run: |
          set -euo pipefail
          # The CLIO overlay declares bundle.windows.nsis.headerImage /
          # sidebarImage. NSIS takes those as uncompressed 24-bit BMPs at exact
          # sizes; a wrong format does NOT fail the Tauri build, it only shows
          # up as a broken page in the shipped installer. Guarded the same way
          # as the icon check: an older gact-tui pin may not carry the script.
          checker="external/gact-tui/desktop/scripts/check-installer-art.mjs"
          if [ ! -f "$checker" ]; then
            echo "check-installer-art.mjs not present in this gact-tui pin yet -- skipping installer-art check"
          else
            node "$checker" "${{ github.workspace }}/branding/clio/installer"
          fi
      - name: Apply CLIO installer art
        shell: bash
        run: |
          set -euo pipefail
          # Same copy-over rationale as the icons: the overlay's relative
          # "installer/..." paths resolve against desktop/src-tauri. Unguarded
          # on purpose -- the overlay declares the art, so missing art must
          # fail the build loudly rather than ship a default-looking installer.
          src="${{ github.workspace }}/branding/clio/installer"
          dst="external/gact-tui/desktop/src-tauri/installer"
          mkdir -p "$dst"
          cp -f "$src"/*.bmp "$dst"/
      - name: Tauri release build
        working-directory: external/gact-tui
        shell: bash
        env:
          # Signed desktop auto-update (v0.9.4.1): the CLIO brand overlay
          # declares plugins.updater (endpoints + pubkey) and
          # bundle.createUpdaterArtifacts: true, so a Tauri build with these
          # secrets present produces a `.sig` alongside each update-capable
          # payload (NSIS exe / macOS .app.tar.gz / AppImage). Because the
          # overlay declares a pubkey, a build WITHOUT the private key is a
          # hard Tauri error ("A public key has been found, but no private
          # key") -- intended: a release must never ship unsigned updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          brand="${{ github.workspace }}/branding/clio/tauri.clio.conf.json"
          cfg="$RUNNER_TEMP/tauri.release.conf.json"
          release_version="${GITHUB_REF_NAME#v}"
          # The tauri CLI rejects multiple --config flags, so for the bundled
          # variant we deep-merge the bundled config + the CLIO branding overlay
          # into a single config (branding wins on conflicts) and pass it once.
          node - "${{ matrix.variant }}" "$brand" "$cfg" "$release_version" <<'NODE'
          const fs = require("node:fs");
          const [variant, brandPath, outputPath, releaseVersion] = process.argv.slice(2);

          if (!/^\d+\.\d+\.\d+(?:\.\d+|-[0-9A-Za-z.-]+)?$/.test(releaseVersion)) {
            throw new Error(`invalid CLIO release version: ${releaseVersion}`);
          }

          // Tauri requires SemVer while CLIO maintenance releases use a
          // fourth numeric component. Preserve the public vX.Y.Z.N identity
          // in tags/assets and encode N as numeric SemVer build metadata
          // internally. Tauri's Windows bundlers reject nonnumeric metadata.
          const maintenance = releaseVersion.match(/^(\d+\.\d+\.\d+)\.(\d+)$/);
          const tauriVersion = maintenance
            ? `${maintenance[1]}+${maintenance[2]}`
            : releaseVersion;

          const isObject = (value) =>
            value !== null && typeof value === "object" && !Array.isArray(value);
          const merge = (base, overlay) => {
            if (!isObject(base) || !isObject(overlay)) {
              return overlay;
            }
            const out = { ...base };
            for (const [key, value] of Object.entries(overlay)) {
              out[key] = key in out ? merge(out[key], value) : value;
            }
            return out;
          };

          const brand = JSON.parse(fs.readFileSync(brandPath, "utf8"));
          const config =
            variant === "bundled"
              ? merge(
                  JSON.parse(
                    fs.readFileSync("desktop/src-tauri/tauri.bundled.conf.json", "utf8"),
                  ),
                  brand,
                )
              : brand;
          // Windows NSIS must copy one compressed runtime payload, not emit
          // 20,000+ File/Delete instructions for the Python distribution.
          // Other platforms retain their existing exploded resource layout.
          if (variant === "bundled" && process.env.RUNNER_OS === "Windows") {
            config.bundle ??= {};
            config.bundle.resources = [
              "gact-runtime.tar.zst",
              "gact-runtime.pack.json",
            ];
          }
          // CLIO-branded installers use the CLIO release identity. GACT keeps
          // its independent package version for its own releases and diagnostics.
          config.version = tauriVersion;
          config.bundle ??= {};
          if (maintenance) {
            config.bundle.windows ??= {};
            config.bundle.windows.wix ??= {};
            config.bundle.windows.wix.version = releaseVersion;
          }
          // Signed auto-update (v0.9.4.1): the CLIO brand overlay already
          // sets bundle.createUpdaterArtifacts + plugins.updater.pubkey (the
          // CLIO minisign key) -- leave both exactly as the brand declared
          // them. Only the update FEED differs per variant: bundled and lite
          // installers are mutually exclusive upgrade paths that must never
          // cross-offer each other's asset, so each variant gets its own
          // manifest file (see gen_tauri_update_manifest.py / release-check).
          if (config.plugins?.updater) {
            const manifestName = variant === "lite" ? "latest-lite.json" : "latest.json";
            config.plugins.updater.endpoints = [
              `https://github.com/iowarp/clio-agent/releases/latest/download/${manifestName}`,
            ];
          }
          fs.writeFileSync(outputPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          # Sidecar guard (#907): every CLIO desktop bundle since the gact-tui
          # de-clio refactor shipped WITHOUT its launcher because no config
          # declared externalBin — release-check saw the installer asset and
          # passed. Assert the merged config declares the sidecar and the
          # launcher fetch-sidecar built actually exists before invoking the
          # bundler (tauri also hard-fails on a declared-but-missing binary).
          jq -e '.bundle.externalBin | index("binaries/clio-agent")' "$cfg" >/dev/null \
            || { echo "::error::sidecar guard: merged tauri config lacks bundle.externalBin binaries/clio-agent (#907)"; exit 1; }
          launcher="desktop/src-tauri/binaries/clio-agent-${{ matrix.target }}"
          [ "${{ runner.os }}" = "Windows" ] && launcher="$launcher.exe"
          [ -f "$launcher" ] \
            || { echo "::error::sidecar guard: launcher $launcher missing (fetch-sidecar did not produce it)"; exit 1; }
          if [ "${{ matrix.variant }}" = "bundled" ] && [ ! -f "desktop/src-tauri/gact-runtime/runtime.json" ]; then
            echo "::error::runtime guard: gact-runtime/runtime.json missing (#909 - bundled variant would ship without its backend)"
            exit 1
          fi
          if [ "${{ matrix.variant }}" = "bundled" ] && [ "${{ runner.os }}" = "Windows" ]; then
            [ -f "desktop/src-tauri/gact-runtime.tar.zst" ] \
              || { echo "::error::runtime archive missing"; exit 1; }
            [ -f "desktop/src-tauri/gact-runtime.pack.json" ] \
              || { echo "::error::runtime pack manifest missing"; exit 1; }
            jq -e '.bundle.resources == ["gact-runtime.tar.zst", "gact-runtime.pack.json"]' "$cfg" >/dev/null \
              || { echo "::error::Windows bundle still enumerates the exploded runtime"; exit 1; }
          fi
          # Tauri only WARNS when the private key does not match the overlay's
          # pubkey, yet every client would reject the resulting signatures at
          # update time. Promote that warning to a hard failure.
          build_log="$RUNNER_TEMP/tauri-build.log"
          pnpm --filter @clio/desktop tauri build --config "$cfg" ${{ matrix.bundle-args }} 2>&1 | tee "$build_log"
          if grep -q "does not match the public key" "$build_log"; then
            echo "::error::updater signing key does not match the brand pubkey" >&2
            exit 1
          fi
      - name: Assert macOS traffic lights survive the brand overlay
        if: runner.os == 'macOS'
        working-directory: external/gact-tui
        shell: bash
        run: |
          set -euo pipefail
          # gact-tui's branded runner (desktop/scripts/run-tauri-branded.mjs)
          # intercepts our --config and re-merges it with tauri.macos.conf.json
          # LAST on darwin, restoring native traffic lights over the CLIO
          # brand's decorations:false. This assert is forward-looking: an
          # older pinned gact-tui without that runner never writes the merged
          # overlay file, so this is a no-op then, never a build failure —
          # but once the runner IS present, a merged config that still has
          # decorations:false is a real regression (custom chrome with no
          # window controls on macOS) and must fail loud.
          runner_script="desktop/scripts/run-tauri-branded.mjs"
          merged="desktop/src-tauri/gen/tauri-brand-merged.conf.json"
          if [ ! -f "$runner_script" ]; then
            echo "run-tauri-branded.mjs not present in this gact-tui pin yet -- skipping macOS decorations assert"
          elif [ ! -f "$merged" ]; then
            echo "run-tauri-branded.mjs present but wrote no merged overlay ($merged) -- skipping macOS decorations assert"
          else
            jq -e '.app.windows[0].decorations == true' "$merged" >/dev/null \
              || { echo "::error::macOS decorations assert: $merged does not restore native traffic lights (app.windows[0].decorations != true)"; exit 1; }
          fi
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/clio-desktop-stage"
          mkdir -p "$stage"
          release_version="${GITHUB_REF_NAME#v}"
          tauri_version="$release_version"
          if [[ "$release_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            tauri_version="${BASH_REMATCH[1]}+${BASH_REMATCH[2]}"
          fi
          root="external/gact-tui/desktop/src-tauri/target/release/bundle"
          if [ -d "external/gact-tui/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
            root="external/gact-tui/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          fi
          # Compute one built artifact's staged filename: normalize the tauri
          # build-metadata version back to the public release version,
          # disambiguate the otherwise-unversioned macOS updater bundle
          # (<App>.app.tar.gz[.sig], the SAME name from every darwin target)
          # by target triple, then (bundled variant only) insert the
          # `-bundled` token before the TRUE extension -- handling the
          # compound `.app.tar.gz` suffix and its detached `.sig` specially
          # so a signature always names the SAME base as its payload.
          stage_name() {
            local base
            base="$(basename "$1")"
            base="${base//$tauri_version/$release_version}"
            case "$base" in
              *.app.tar.gz.sig) base="${base%.app.tar.gz.sig}-${{ matrix.target }}.app.tar.gz.sig" ;;
              *.app.tar.gz)     base="${base%.app.tar.gz}-${{ matrix.target }}.app.tar.gz" ;;
            esac
            if [ "${{ matrix.variant }}" = "bundled" ]; then
              case "$base" in
                *.app.tar.gz.sig) base="${base%.app.tar.gz.sig}-bundled.app.tar.gz.sig" ;;
                *.app.tar.gz)     base="${base%.app.tar.gz}-bundled.app.tar.gz" ;;
                *.sig)
                  local inner iext istem
                  inner="${base%.sig}"
                  iext="${inner##*.}"
                  istem="${inner%.*}"
                  base="${istem}-bundled.${iext}.sig"
                  ;;
                *)
                  local ext stem
                  ext="${base##*.}"
                  stem="${base%.*}"
                  base="${stem}-bundled.${ext}"
                  ;;
              esac
            fi
            printf '%s\n' "$base"
          }
          if [ -d "$root" ]; then
            find "$root" -maxdepth 2 -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.AppImage' -o -iname '*.rpm' -o -iname '*.sig' -o -name '*.app.tar.gz' \) -print0 |
              while IFS= read -r -d '' f; do
                cp "$f" "$stage/$(stage_name "$f")"
              done
          else
            root="external/gact-tui/desktop/src-tauri/target/release"
            find "$root" -maxdepth 1 -type f -iname '*.exe' -print0 |
              while IFS= read -r -d '' f; do
                base="$(basename "$f")"
                stem="${base%.*}"
                cp "$f" "$stage/${stem}-${{ matrix.target }}.${base##*.}"
              done
          fi
          # Payload floor: a bundled installer embeds the clio-agent Python
          # runtime, so it is much larger than the ~10-20 MB lite Tauri bundle.
          # A bundled artifact under the floor means the runtime never got
          # embedded (the connect-mode regression behind #841) -- fail loudly.
          # `.sig` files are excluded: a detached signature is a few hundred
          # bytes by design and would always trip the floor.
          if [ "${{ matrix.variant }}" = "bundled" ]; then
            floor_mb="${BUNDLED_PAYLOAD_FLOOR_MB:-60}"
            floor=$((floor_mb * 1024 * 1024))
            staged=0
            while IFS= read -r -d '' f; do
              staged=$((staged + 1))
              size=$(wc -c < "$f")
              if [ "$size" -lt "$floor" ]; then
                echo "::error::payload assert: $(basename "$f") is ${size}B, under the ${floor_mb} MB bundled floor (runtime not embedded)"
                exit 1
              fi
            done < <(find "$stage" -type f -name '*-bundled.*' ! -name '*.sig' -print0)
            if [ "$staged" -eq 0 ]; then
              echo "::error::payload assert: bundled variant staged no *-bundled.* artifact"
              exit 1
            fi
          fi
          # Cross-platform checksum: Linux has both, macOS has only `shasum`,
          # Windows git-bash has only `sha256sum`. Prefer sha256sum, else shasum.
          if command -v sha256sum >/dev/null 2>&1; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          (cd "$stage" && $SUM * > "SHA256SUMS.${{ matrix.target }}.${{ matrix.variant }}.txt")
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/clio-desktop-stage/*

  release-check:
    name: release completeness
    needs: [desktop, web, tui, installers]
    # Run even when a matrix leg failed: a silently-dropped bundle (the v0.5.17
    # aarch64 bundled .dmg, #841 F-15) is exactly the case this must catch. Also
    # runs standalone on workflow_dispatch (needs: jobs above are then skipped,
    # not failed, which always() tolerates) -- the frozen-at-tag escape hatch.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # workflow_dispatch's explicit tag input wins (the frozen-at-tag escape
      # hatch); a real tag push falls back to the triggering ref, which for a
      # `push: tags: v*` event IS the tag name.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate signed Tauri update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/gen_tauri_update_manifest.py --tag "$TAG" --variant bundled --out latest.json
          python3 scripts/gen_tauri_update_manifest.py --tag "$TAG" --variant lite --out latest-lite.json
          gh release upload "$TAG" latest.json latest-lite.json --clobber
      - name: Assert release asset completeness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets -q '.assets[].name' \
            | python3 scripts/check_release_completeness.py
      - name: Backstop release notes from CHANGELOG
        # action-gh-release creates the release page with only the tag/commit
        # subject as its body. The release-clio skill's curated notes (step 6b)
        # are the standard; this backstop fills a still-bare body with the
        # CHANGELOG's section for the tag so a release page is never just
        # "Merge pull request #NNNN". It NEVER overwrites a non-bare body.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes_from_changelog.py "$TAG" > /tmp/notes.md || {
            echo "no CHANGELOG section for $TAG; leaving release body untouched"; exit 0; }
          BODY_LEN=$(gh release view "$TAG" --json body -q '.body' | wc -c)
          if [ "$BODY_LEN" -lt 200 ]; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
            echo "backstop notes applied (previous body was ${BODY_LEN} bytes)"
          else
            echo "body already curated (${BODY_LEN} bytes); not touching it"
          fi
