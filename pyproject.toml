[project]
name = "clio-agent"
version = "0.5.1"
description = "CLIO Agent — Autonomous AI agent framework for scientific data management. Part of the IOWarp platform."
authors = [
    { name = "Antonis Kougkas", email = "a.kougkas@gmail.com" },
    { name = "Gnosis Research Center", email = "gra@iit.edu" }
]
maintainers = [
    { name = "Antonis Kougkas", email = "a.kougkas@gmail.com" }
]
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.12"

keywords = [
    "clio-agent", "clio", "iowarp", "autonomous-agent", "self-improving", "multi-agent",
    "arc-memory", "optimizer-layer", "agent-registry", "a2a-protocol",
    "scientific-computing", "hpc", "data-io-optimization",
    "fastmcp", "mcp", "react-pattern", "llm-agents",
    "hdf5", "adios", "parquet", "slurm", "data-science"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Environment :: Console",
]

dependencies = [
    "dspy>=3.1.3",
    "fastmcp>=3.2.4",
    "requests>=2.31.0",
    "h5py>=3.10.0",
    "pyarrow>=14.0.0",
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.0",
    "sortedcontainers>=2.4.0",
    "lru-dict>=1.3.0",
    "msgspec>=0.18.0",
    "matplotlib>=3.8.0",
    # gact backend (clio_agent.gact.app) — shipped product surface, not optional
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
]

[project.optional-dependencies]
optimizers = [
    # Optimizer Layer (v0.4.0+)
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

tools = [
    # pyarrow moved to core dependencies (v0.2.0)
]

iowarp = [
    "pyzmq>=25.0.0",             # ZeroMQ Python bindings for IOWarp CTE runtime
]

argonne = [
    # Globus Auth bridge for the ALCF inference gateway (Sophia/Polaris vLLM).
    # Optional: only needed when CLIO_LM_PROVIDER=argonne. See
    # src/clio_agent/providers/argonne_auth.py.
    "globus-sdk>=3.0.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

all = [
    "clio-agent[optimizers,tools,iowarp,argonne,dev]",
]

[project.urls]
Homepage = "https://github.com/iowarp/clio-agent"
Documentation = "https://github.com/iowarp/clio-agent/tree/main/ai-docs"
Repository = "https://github.com/iowarp/clio-agent"
Issues = "https://github.com/iowarp/clio-agent/issues"

[project.scripts]
clio-agent = "clio_agent.ui.cli:run_cli"
clio-agent-api = "clio_agent.ui.api:main"
# GACT v0.2 surface. Peer of clio-agent-api; runs on its own port.
# See docs/tui/ for the integration spec. Wired in CLIO-BBBBBBBBBB6;
# real endpoints come online in CLIO-BBBBBBBBBB7-12.
clio-agent-gact = "clio_agent.gact.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"  # CLIO-BBBBBBBBBB13: SSE tests use async httpx
markers = [
    "integration: marks tests requiring full-stack/external runtime behavior",
]
addopts = [
    "--verbose",
    "--cov=clio_agent",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module level import not at top (sys.path for UV script execution)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter typing
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
