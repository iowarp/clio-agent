[project]
name = "clio-agent"
version = "0.9.1.1"
description = "CLIO Agent — Autonomous AI agent framework for scientific data management. Part of the IOWarp platform."
authors = [
    { name = "Jaime Cernuda", email = "jcernudagarcia@illinoistech.edu" },
    { name = "Antonis Kougkas", email = "a.kougkas@gmail.com" },
    { name = "Gnosis Research Center", email = "gra@iit.edu" }
]
maintainers = [
    { name = "Jaime Cernuda", email = "jcernudagarcia@illinoistech.edu" },
    { name = "Antonis Kougkas", email = "a.kougkas@gmail.com" }
]
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.12"

keywords = [
    "clio-agent", "clio", "iowarp", "autonomous-agent", "self-improving", "multi-agent",
    "arc-memory", "optimizer-layer", "agent-registry", "a2a-protocol",
    "scientific-computing", "hpc", "data-io-optimization",
    "fastmcp", "mcp", "react-pattern", "llm-agents",
    "hdf5", "adios", "parquet", "slurm", "data-science"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Environment :: Console",
]

dependencies = [
    # Intentional exact prerelease: CLIO's retained ReActV2 runtime uses DSPy 3.3 APIs.
    # Locked/source and direct-wheel installs resolve the exact dependency normally.
    # uv's registry-backed `tool install clio-agent==...` path requires DSPy as an
    # explicit `--with dspy==3.3.0b1` root because the top-level CLIO release is stable.
    "dspy==3.3.0b1",
    # DSPy permits a broad LiteLLM range. Pin the tested stable wheel so a global
    # prerelease policy can never select a LiteLLM dev sdist on Windows.
    "litellm==1.91.3",
    # Subscription-authenticated Codex provider. CLIO imports the official Python
    # SDK directly; the SDK owns its pinned runtime and JSON-RPC lifecycle.
    "openai-codex>=0.147.0,<0.148.0",
    "fastmcp==4.0.0b1",  # 2026-07-28 line (#1107); re-lock needs --prerelease=allow (beta).
    "fastmcp-tasks==4.0.0b1",
    "clio-schemas==0.2.3",
    "pydantic>=2.12,<2.14",
    "requests>=2.31.0",
    "h5py>=3.10.0",
    "pyarrow>=14.0.0",
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.0",
    "sortedcontainers>=2.4.0",
    "lru-dict>=1.3.0",
    "msgspec>=0.18.0",
    "platformdirs>=4.0.0",
    "matplotlib>=3.8.0",
    # ARC default store backend: clio-core CTE (in-process, no daemon). Shipped by
    # default so CTE works out of the box; make_arc_store falls back to local files
    # if the runtime is unavailable, and durability/fault-tolerance (replication,
    # erasure coding) come from the CTE config. CLIO_ARC_STORE=local opts out.
    "iowarp-core>=2.1.0",
    # Cross-platform process lifecycle for the shared clio-core runtime daemon
    # (connect-or-spawn + last-one-out release). clio-core deploys identically on
    # Linux/macOS/Windows (per upstream), so only the host-side primitives differ:
    # filelock = host-global spawn/refcount lock (fcntl on POSIX, msvcrt on Windows);
    # psutil = OS-portable process liveness, create-time (PID-reuse guard), and
    # terminate/kill. Replaces Linux-only fcntl / /proc / os.kill so the kill
    # semantics hold on all three OSes.
    "filelock>=3.12.0",
    "psutil>=5.9.0",
    # gact backend (clio_agent.gact.app) — shipped product surface, not optional
    "fastapi>=0.140",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
    # clio_agent.sdk (#799) — the typed GACT client imports httpx directly
    # (already present transitively via fastmcp/dspy; declared so the SDK
    # does not lean on someone else's dependency tree).
    "httpx>=0.27.0",
    # Scheduler local-timezone / DST correctness (#1081, P4.3). ``tzdata`` ships the
    # IANA zone database (zoneinfo has no system db on Windows); ``tzlocal`` resolves
    # the system's local IANA zone name so "0 9 * * *" fires at 9am LOCAL, DST-correct
    # — the Windows cron sore point. Both are small, pure-Python, no native deps.
    "tzdata>=2024.1",
    "tzlocal>=5.2",
    # Document artifact production. These are the format-native libraries used
    # by the built-in document skills; LibreOffice/Tectonic remain explicit
    # external render/recalculation prerequisites.
    "python-docx>=1.1.2,<2",
    "openpyxl>=3.1.5,<4",
    "python-pptx>=1.0.2,<2",
    "odfpy>=1.4.1,<2",
    "pypdf>=5.1.0,<7",
]

[project.optional-dependencies]
optimizers = [
    # Optimizer Layer (v0.4.0+)
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

adios = [
    # Optional because PyPI wheels are not available for all Windows/Python
    # combinations; CLIO still exposes BP container/profiling inspection
    # without this package and surfaces structured dependency errors for
    # variable reads.
    "adios2>=2.10.0; platform_system != 'Windows'",
]

argonne = [
    # Globus Auth bridge for the ALCF inference gateway (Sophia/Polaris vLLM).
    # Optional: only needed when CLIO_LM_PROVIDER=argonne. See
    # src/clio_agent/providers/argonne_auth.py.
    "globus-sdk>=3.0.0",
]

claude-code = [
    # Optional Claude Agent SDK transport (claude_code_transport="sdk"): a
    # persistent in-process Claude Code session instead of one spawn per LM
    # call (#715). Auth is the user's Claude Code OAuth login.
    #
    # mcp-2 note (#1107): the SDK declares a protective `mcp<2` bound for its
    # SDK-MCP-server bridging feature. CLIO uses the SDK PURELY as an LLM
    # provider (ClaudeSDKClient/ClaudeAgentOptions — owner decision: "to us he
    # is a provider of llm, not a tool calling semantics") and never touches
    # that bridging surface. The [tool.uv] override below neutralizes the
    # bound; the full import surface is verified under mcp 2.0.0 by
    # tests and the compat matrix doc. The live SDK-session smoke runs at the
    # P0 phase gate.
    "claude-agent-sdk>=0.2.110",
]

flowcept = [
    # Optional queryable agentic-provenance provider. CLIO imports it only
    # when provenance.agentic.providers includes "flowcept".
    "flowcept[redis,mongo]>=1.0.3,<2",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.5.0",  # -n / --dist loadfile for the concurrency flake-hunt (#735)
    "pytest-repeat>=0.9.3",  # --count for the flake-hunt (#735)
    "hypothesis>=6",  # property-based tests (parser invariants pilot, #773 Slice 16)
    "pandas>=2.0.0",  # executable reproduce-chain proof (S7 #973): the pandas stage
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

all = [
    "clio-agent[optimizers,adios,argonne,claude-code,flowcept,dev]",
]

[project.urls]
Homepage = "https://github.com/iowarp/clio-agent"
Documentation = "https://iowarp.github.io/clio-agent/"
Repository = "https://github.com/iowarp/clio-agent"
Issues = "https://github.com/iowarp/clio-agent/issues"

[project.scripts]
clio-agent = "clio_agent.ui.cli:main"
clio-agent-api = "clio_agent.ui._deprecated_api:main"
# Deprecation alias for the retired standalone gact entry point. `clio-agent
# serve` is the single front door (#830); this stays functional for one
# release so old installed launchers keep working, emitting a stderr notice.
clio-agent-gact = "clio_agent.gact.app:main_deprecated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Hard-exclude the vendored submodules/large dirs from every target's tree
# walk (not just the sdist include filter) -- a submodule with its own
# installed node_modules (e.g. external/gact-tui/apps) can carry pathological
# deep paths that blow Windows' legacy MAX_PATH during hatchling's directory
# scan even when it's not in the sdist's include list.
exclude = [
    "external",
    "docs/ref",
    "benchmark",
    ".grind",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clio_agent"]

[tool.hatch.build.targets.sdist]
# Keep the source tarball small + PyPI-uploadable (project limit is 100 MB): ship
# only the package source + build metadata, NOT the repo's vendored/large dirs
# (docs/ref, the external/ submodules, benchmark/, .grind/, tmp/) which otherwise
# balloon the sdist to >200 MB and get rejected ("400 File too large").
include = [
    "src/clio_agent",
    "pyproject.toml",
    "README.md",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"  # SSE tests use async httpx
markers = [
    "integration: marks tests requiring full-stack/external runtime behavior",
    "benchmark: marks long real-provider stress benchmark tests",
    "real_case: end-to-end live CLIO blueprint case (a tier above unit/integration; needs CLIO_RUN_LIVE=1)",
    "live: hits a live gact server + external provider (slow; skipped unless CLIO_RUN_LIVE=1)",
    "relay: drives clio-agent's relay client surfaces against a real relay MCP door (#1226 L2.5 rung); typed-skips when no door is configured/reachable, no CLIO_RUN_LIVE gate needed",
    "concurrency: thread-safety / shared-state tests run under xdist load x3 in the flake-hunt CI job (#735)",
    "linux_fence: OS write-fence sabotage suite (srt/Landlock); auto-skipped where the host cannot run it (#976 B2)",
    "sandbox_conformance: B6 campaign-done conformance gate (#980); asserts a typed mechanism/reason per (seam x tier) — the unit parts run everywhere, the live parts need a resolved fence",
]
# Keep addopts empty: forcing --verbose + coverage (incl. 23MB htmlcov) on
# every invocation — even --collect-only — punishes local runs. CI passes
# its coverage flags explicitly in .github/workflows/ci.yml (#773).
addopts = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module level import not at top (sys.path for UV script execution)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter typing
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.mutmut]
# Mutation-testing pilot scope (#773 slice 19): the two correctness-critical
# leaf modules, exercised by the focused runner shims in tests/mutmut_runner/.
# Run via .github/workflows/mutation.yml (scheduled) or locally on POSIX:
#   uv pip uninstall clio-agent && PYTHONPATH=src uv run --no-sync mutmut run
# (the editable install must be removed or its .pth shadows the mutated copy).
paths_to_mutate = ["src/clio_agent/arc/segments.py", "src/clio_agent/gact/events.py"]
tests_dir = ["tests/mutmut_runner/"]
also_copy = ["src/clio_agent/", "tests/"]

[tool.uv]
# #1107: claude-agent-sdk declares mcp<2 as a protective bound for its
# SDK-MCP-server bridging feature, which CLIO never uses (LLM provider only).
# Override it so the mcp-2 core and the claude-code extra co-resolve; the
# combination's import surface is test-verified, the live session smoke runs
# at the phase gate. Drop this override when upstream supports mcp 2.
override-dependencies = ["mcp>=2.0.0"]

[tool.uv.sources]
clio-schemas = { git = "https://github.com/iowarp/clio-schemas.git", rev = "f99450067e498de25c28764e15ecad1a88b7d595" }
