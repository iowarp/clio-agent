[project]
name = "claudio"
version = "0.1.0"
description = "Self-Improving Autonomous Agent for Scientific Data Management - IOWarp Intelligence Layer (CEI)"
authors = [
    { name = "IOWarp Team", email = "gra@illinoistech.edu" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

keywords = [
    "claudio", "iowarp", "autonomous-agent", "self-improving", "multi-agent",
    "arc-memory", "optimizer-layer", "agent-registry", "a2a-protocol",
    "scientific-computing", "hpc", "data-io-optimization",
    "fastmcp", "mcp", "react-pattern", "llm-agents",
    "hdf5", "adios", "parquet", "slurm", "data-science"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "dspy-ai>=3.0.3",
    "fastmcp>=2.13.0",
]

[project.optional-dependencies]
ui = [
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.0",
]

memory = [
    # ARC Memory Layer (v0.2.0+)
    "sortedcontainers>=2.4.0",
    "lru-dict>=1.3.0",
    "msgspec>=0.18.0",  # Efficient serialization with msgpack support
]

optimizers = [
    # Optimizer Layer (v0.4.0+)
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
]

tools = [
    "h5py>=3.10.0",              # HDF5 MCP server
    "adios2>=2.9.0",             # ADIOS MCP server (v0.3.0+)
    "pyarrow>=14.0.0",           # Parquet MCP server (v0.3.0+)
]

iowarp = [
    "pyzmq>=25.0.0",             # ZeroMQ Python bindings for IOWarp CTE runtime
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

all = [
    "claudio[ui,memory,optimizers,api,tools,iowarp,dev]",
]

[project.urls]
Homepage = "https://github.com/iowarp/claudio"
Documentation = "https://github.com/iowarp/claudio/tree/main/ai-docs"
Repository = "https://github.com/iowarp/claudio"
Issues = "https://github.com/iowarp/claudio/issues"

[project.scripts]
claudio = "claudio.ui.cli:run_cli"
claudio-api = "claudio.ui.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=claudio",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter typing
ignore_missing_imports = true
