[project]
name = "clio-agent"
version = "0.5.17"
description = "CLIO Agent — Autonomous AI agent framework for scientific data management. Part of the IOWarp platform."
authors = [
    { name = "Jaime Cernuda", email = "jcernudagarcia@illinoistech.edu" },
    { name = "Antonis Kougkas", email = "a.kougkas@gmail.com" },
    { name = "Gnosis Research Center", email = "gra@iit.edu" }
]
maintainers = [
    { name = "Jaime Cernuda", email = "jcernudagarcia@illinoistech.edu" },
    { name = "Antonis Kougkas", email = "a.kougkas@gmail.com" }
]
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.12"

keywords = [
    "clio-agent", "clio", "iowarp", "autonomous-agent", "self-improving", "multi-agent",
    "arc-memory", "optimizer-layer", "agent-registry", "a2a-protocol",
    "scientific-computing", "hpc", "data-io-optimization",
    "fastmcp", "mcp", "react-pattern", "llm-agents",
    "hdf5", "adios", "parquet", "slurm", "data-science"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Environment :: Console",
]

dependencies = [
    "dspy>=3.1.3",
    "fastmcp>=3.2.4",
    "requests>=2.31.0",
    "h5py>=3.10.0",
    "pyarrow>=14.0.0",
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.0",
    "sortedcontainers>=2.4.0",
    "lru-dict>=1.3.0",
    "msgspec>=0.18.0",
    "platformdirs>=4.0.0",
    "matplotlib>=3.8.0",
    # ARC default store backend: clio-core CTE (in-process, no daemon). Shipped by
    # default so CTE works out of the box; make_arc_store falls back to local files
    # if the runtime is unavailable, and durability/fault-tolerance (replication,
    # erasure coding) come from the CTE config. CLIO_ARC_STORE=local opts out.
    "iowarp-core>=2.1.0",
    # Cross-platform process lifecycle for the shared clio-core runtime daemon
    # (connect-or-spawn + last-one-out release). clio-core deploys identically on
    # Linux/macOS/Windows (per upstream), so only the host-side primitives differ:
    # filelock = host-global spawn/refcount lock (fcntl on POSIX, msvcrt on Windows);
    # psutil = OS-portable process liveness, create-time (PID-reuse guard), and
    # terminate/kill. Replaces Linux-only fcntl / /proc / os.kill so the kill
    # semantics hold on all three OSes.
    "filelock>=3.12.0",
    "psutil>=5.9.0",
    # gact backend (clio_agent.gact.app) — shipped product surface, not optional
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
]

[project.optional-dependencies]
optimizers = [
    # Optimizer Layer (v0.4.0+)
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

tools = [
    # pyarrow moved to core dependencies (v0.2.0)
]

adios = [
    # Optional because PyPI wheels are not available for all Windows/Python
    # combinations; CLIO still exposes BP container/profiling inspection
    # without this package and surfaces structured dependency errors for
    # variable reads.
    "adios2>=2.10.0; platform_system != 'Windows'",
]

# NOTE: the optional Codex SDK transport (CLIO_CODEX_TRANSPORT=sdk) needs
# `openai-codex` from git (not on PyPI). A direct URL dependency cannot ship in
# PyPI package metadata (upload is rejected with "Can't have direct dependency"),
# so it is intentionally NOT a declared extra. Install it manually when needed:
#   uv pip install "openai-codex @ git+https://github.com/openai/codex.git@79f044ed34c60af815feef12e8e665f35d54871e#subdirectory=sdk/python"

iowarp = [
    # clio-core CTE is now a CORE dependency (the default ARC backend), so this
    # extra is redundant — kept as an explicit opt-in alias and for [all].
    "iowarp-core>=2.1.0",
]

argonne = [
    # Globus Auth bridge for the ALCF inference gateway (Sophia/Polaris vLLM).
    # Optional: only needed when CLIO_LM_PROVIDER=argonne. See
    # src/clio_agent/providers/argonne_auth.py.
    "globus-sdk>=3.0.0",
]

claude-code = [
    # Optional Claude Agent SDK transport (claude_code_transport="sdk"): a
    # persistent in-process Claude Code CLI session instead of one `claude -p`
    # spawn per LM call (kills the per-call cold-start, #715). Auth is the user's
    # Claude Code OAuth login (no API key). The default "exec" transport needs only
    # the `claude` CLI on PATH, so this is opt-in. See
    # src/clio_agent/providers/claude_code_litellm.py.
    "claude-agent-sdk>=0.2.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

all = [
    "clio-agent[optimizers,tools,adios,iowarp,argonne,claude-code,dev]",
]

[project.urls]
Homepage = "https://github.com/iowarp/clio-agent"
Documentation = "https://github.com/iowarp/clio-agent/tree/main/ai-docs"
Repository = "https://github.com/iowarp/clio-agent"
Issues = "https://github.com/iowarp/clio-agent/issues"

[project.scripts]
clio-agent = "clio_agent.ui.cli:run_cli"
clio-agent-api = "clio_agent.ui.api:main"
# GACT v0.2 surface. Peer of clio-agent-api; runs on its own port.
# See docs/tui/ for the integration spec. Wired in CLIO-BBBBBBBBBB6;
# real endpoints come online in CLIO-BBBBBBBBBB7-12.
clio-agent-gact = "clio_agent.gact.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatch requires this opt-in to allow git URLs in dependencies (we use
# one for the optional [codex] extra — openai_codex isn't on PyPI yet).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/clio_agent"]

[tool.hatch.build.targets.sdist]
# Keep the source tarball small + PyPI-uploadable (project limit is 100 MB): ship
# only the package source + build metadata, NOT the repo's vendored/large dirs
# (docs/ref, the external/ submodules, benchmark/, .grind/, tmp/) which otherwise
# balloon the sdist to >200 MB and get rejected ("400 File too large").
include = [
    "src/clio_agent",
    "pyproject.toml",
    "README.md",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"  # CLIO-BBBBBBBBBB13: SSE tests use async httpx
markers = [
    "integration: marks tests requiring full-stack/external runtime behavior",
    "benchmark: marks long real-provider stress benchmark tests",
    "real_case: end-to-end live CLIO blueprint case (a tier above unit/integration; needs CLIO_RUN_LIVE=1)",
    "live: hits a live gact server + external provider (slow; skipped unless CLIO_RUN_LIVE=1)",
]
addopts = [
    "--verbose",
    "--cov=clio_agent",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # module level import not at top (sys.path for UV script execution)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter typing
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
