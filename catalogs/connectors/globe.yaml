# 3D globe: the map example server of the MCP Apps extension (modelcontextprotocol/ext-apps,
# examples/map-server; MIT, the repository moving to Apache-2.0), published on npm as
# @modelcontextprotocol/server-map. CLIO starts it through npx over stdio and never bundles
# it. The version is pinned to the release qualified here (2.0.4). Its show-map tool returns
# a ui:// view: a CesiumJS globe (loaded from cesium.com) with OpenStreetMap tiles, no
# Cesium ion token. Its geocode tool asks OpenStreetMap's Nominatim. It has no needs and
# ships no mark of its own, so the entry has no logo (apps ledger, "More connectors").
- id: globe
  name: 3D globe
  description: Show regions, places and data footprints on an interactive 3D globe with OpenStreetMap, and find places by name
  server:
    command: npx
    args: [-y, --silent, "@modelcontextprotocol/server-map@2.0.4", --stdio]
  needs: []
