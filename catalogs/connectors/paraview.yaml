# ParaView: IOWarp's ParaView server from clio-kit, rebuilt for this connector (plan PV1
# to PV13). It runs on this machine, or reaches ParaView on another one over SSH.
- id: paraview
  name: ParaView
  logo: paraview.svg
  description: See 3D fields, volumes and meshes in ParaView in a live view you can rotate, slice and contour, on this machine or another
  server:
    command: clio-kit
    args: [mcp-server, paraview]
    env:
      PARAVIEW_ADDRESS: ${need.address}
      PARAVIEW_VIA: ${need.via}
      PARAVIEW_PREPARE: ${need.prepare}
      PARAVIEW_PVSERVER: ${need.pvserver}
      PARAVIEW_VERSION: ${need.version}
  needs:
    - key: address
      kind: address
      label: Where ParaView runs
      required: false
      agent_settable: true
      help: Leave empty for this machine. Otherwise an SSH host name.
    - key: via
      kind: value
      label: Jump host
      required: false
      agent_settable: true
    - key: prepare
      kind: value
      label: Command to run first
      required: false
      agent_settable: true
      help: For example "module load paraview".
    - key: pvserver
      kind: address
      label: ParaView server to join
      required: false
      agent_settable: true
      help: A running pvserver as host:port, for example the local port a relay service gives. Leave empty to join one on port 11111 where ParaView runs, if there is one.
    - key: version
      kind: value
      label: ParaView version
      required: false
      agent_settable: true
      help: The ParaView to fetch for this machine when none is installed. It must match the server it joins, for example 5.13.1.
  plugin: paraview
