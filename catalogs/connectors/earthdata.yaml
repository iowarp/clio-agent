# NASA Earthdata: datalayer/earthdata-mcp-server, BSD-3-Clause, a plain MCP server (no
# view) over NASA's Common Metadata Repository through earthaccess. CLIO starts it through
# the clio-kit launcher: clio-kit's earthdata server (mcp-servers/earthdata) runs
# earthdata-mcp-server exactly as published, pinned to 0.6.0 and locked in clio-kit
# (uv.lock), in its own environment; CLIO never imports it. The group, Earth science,
# comes from clio-kit's clio-geoscience bundle (derive.yaml). Searching datasets and their files is anonymous;
# downloading files needs a free NASA Earthdata Login, read from the two optional needs
# (apps ledger, "More connectors"). NASA's insignia may not be used without NASA's
# permission, and the server ships no mark of its own, so its logo, earthdata.svg, is ours:
# the Earth with a satellite in orbit, drawn for CLIO (apps ledger, "Connector logos (LG)").
- id: earthdata
  name: NASA Earthdata
  logo: earthdata.svg
  description: Search NASA Earthdata for Earth-science datasets and their files, and download them with an Earthdata Login
  server:
    command: clio-kit
    args: [mcp-server, earthdata]
    env:
      EARTHDATA_USERNAME: ${need.username}
      EARTHDATA_PASSWORD: ${need.password}
  needs:
    - key: username
      kind: value
      label: Earthdata Login username
      required: false
      help: Searching needs no account. Downloading files needs a free NASA Earthdata Login (urs.earthdata.nasa.gov).
    - key: password
      kind: secret
      label: Earthdata Login password
      required: false
