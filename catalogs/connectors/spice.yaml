# Circuit simulation with ngspice or LTspice: cognitohazard/ltspice-mcp, GPL-3.0-or-later.
# CLIO starts it through the clio-kit launcher: clio-kit's spice server (mcp-servers/spice)
# runs ltspice-mcp exactly as published, as its own program (never imported or linked),
# pinned to 0.8.0 (the 9455f38 merge) and locked in clio-kit. The server finds ngspice or
# LTspice on this machine itself; it has no needs, and the catalogue's prerequisite note
# says one must be installed (`requires`). The group, Electronics, comes from clio-kit's
# clio-electronics bundle (derive.yaml).
# ltspice-mcp ships no mark, so its logo, spice.svg, is ours: a circuit chip drawn for
# CLIO (apps ledger, "Connector logos (LG)").
- id: spice
  name: SPICE circuit simulation
  logo: spice.svg
  description: Simulate circuits with ngspice or LTspice and plot their waveforms
  server:
    command: clio-kit
    args: [mcp-server, spice]
  needs: []
