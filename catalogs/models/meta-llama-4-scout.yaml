# Seeded from clio-coder's cloud-models/alcf.yaml (model-capabilities brief Part 8.5).
# Corrected: Llama 4 is natively multimodal (image input). The seed said vision: false;
# the Hub repo reports pipeline_tag image-text-to-text, Llama4ForConditionalGeneration
# and a processor_config.json (recorded in tests/fixtures/capabilities/hf_repo/).
- family: meta-llama-4-scout
  matchPatterns:
    - meta-llama/llama-4-scout
    - llama-4-scout
  capabilities:
    chat: true
    tools: true
    toolCallFormat: openai
    reasoning: false
    structuredOutputs: json-schema
    vision: true
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 131072
    maxTokens: 8192
