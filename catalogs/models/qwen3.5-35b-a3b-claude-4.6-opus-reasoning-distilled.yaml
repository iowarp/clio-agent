# Seeded verbatim from clio-coder's local-models/clio-local-coding-targets.yaml (model-capabilities brief Part 8.5).
- family: qwen3.5-35b-a3b-claude-4.6-opus-reasoning-distilled
  matchPatterns:
    - qwen3.5-35b-a3b-claude-4.6-opus-reasoning-distilled
    - qwen3.5-35b-a3b-claude-4.6-opus-reasoning-distilled-i1
    - qwen3.5-35b-a3b-claude-4.6-opus-reasoning-distilled-i1-q4_k_m
    - qwen35-distilled
    - qwen35-distilled-i1
    - qwen35-distilled-i1-q4_k_m
