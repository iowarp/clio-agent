# Seeded verbatim from clio-coder's local-models/clio-local-coding-targets.yaml (model-capabilities brief Part 8.5).
- family: gemma4-26b-a4b
  matchPatterns:
    - gemma-4-26b-a4b
    - gemma4-26b-a4b
    - gemma-4-26b-a4b-it
    - gemma4-26b-a4b-it
    - gemma-4-26b-a4b-it-q4
    - gemma-4-26b-a4b-it-q4_k_m
  capabilities:
    chat: true
    tools: true
    toolCallFormat: openai
    reasoning: true
    thinkingFormat: qwen-chat-template
    structuredOutputs: json-schema
    vision: true
    audio: false
    embeddings: false
    rerank: false
    fim: false
    contextWindow: 262144
    maxTokens: 65536
  quirks:
    sampling:
      thinking:
        temperature: 0.3
        topP: 0.9
        topK: 20
        maxTokens: 8192
        reasoningBudget: 4096
    gpuTiers:
      "32gb": "Main-agent candidate for the mini and dynamo class when Gemma behavior is preferred."
    runtimePreference:
      lmstudioNative: "Use for already-loaded LM Studio sessions and multimodal checks."
      openaiCompat: "Preferred fallback when SDK rawTools do not match the template."
      llamaCpp: "OpenAI-compatible chat completions with --jinja, --reasoning on, and the matching mmproj."
    llamaCpp:
      ctxSize: 262144
      cacheTypeK: q8_0
      cacheTypeV: q8_0
      flashAttn: true
      nGpuLayers: 99
      mmproj: true
    thinkingControl: "Gemma 4 exposes thinking through chat template enable_thinking support."
    thinking:
      mechanism: on-off
      guidance: |
        Gemma 4 chat template exposes thinking only as on or off via
        enable_thinking. Intermediate levels coerce to on. The MoE A4B variant
        keeps the same template behavior as the dense gemma-4 family.

